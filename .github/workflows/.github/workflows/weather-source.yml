name: Import actual Temp and Sun Info widgets
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4e0d2e649e45f5f868c779f652ef188bd7323674
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/weather-source-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          for preset in Nothing_Temp Nothing_Sun_Info; do
            curl -fsSL "https://raw.githubusercontent.com/AumGupta/KWGT-Widgets/96ca27be4cbff35efec5a86c64dd39fd065c958f/widgets/${preset}.kwgt" -o "/tmp/${preset}.kwgt"
            mkdir -p "/tmp/weather-presets/${preset}" && unzip -oq "/tmp/${preset}.kwgt" -d "/tmp/weather-presets/${preset}"
          done
          cat > /tmp/widget-task.txt <<'TASK'
          Implement two actual-source weather widgets, Nothing_Temp and Nothing_Sun_Info, as23/24 in existing app. Read /tmp/weather-presets/*/preset.json. Keep all22 providers and their geometry/behavior intact. Reuse isolated AwesomeAWidgets-adapted weather/WeatherRepository and WeatherModels code. They are currently unregistered and WeatherCache.load() is stub; repair real cache. Do not add DateTime3 missing time expression, media, proprietary assets/fonts or any unrelated source. Read existing native provider/catalog/MainActivity/WidgetUpdater patterns first. Finish usable implementation, not scaffolding.
          
          Weather is optional and OFF by default. Add clear in-app Weather settings dialog reachable from header, weather previews and tapping weather widget. Explain BEFORE any request: Open-Meteo gets manually entered city search query or chosen coordinates plus network IP; no GPS/device location/background location or telemetry; personal noncommercial service with attribution and terms/privacy URLs. User must explicitly enable weather then type city and Search, choose unambiguous city+region+country result; no default city, no startup request/geocoding, no user area hardcoded. Only requests while enabled with manually selected city. Add Celsius/Fahrenheit, refresh, disable/delete location+cached data controls. Revocation must cancel pending work, prevent in-flight results restoring data, redraw disabled widgets. Location/unit changes must clear mismatched cache and prevent old request race. On device externalnetwork only actual data, no fixtures/dummy fallback. For tests inject transport, fixtures only test code. Add INTERNET normal permission only; NO GPS/location/exact alarms/service/notification/battery optimizations/boot network request. Existing optional exact-alarm permission unchanged. UI must remain responsive; bounded off-main network with strict timeouts/limited response sizes; no background polling/scheduler for weather. Refresh on explicit tap/refresh or app resumed only if enabled and cache older than60minutes, at most1 fetch/hour auto; process-dead home widget clearly cached/updated time, no live claim. Android widget update loads cache only, NEVER network in receiver/main thread. Real stale label once >60min or previous day; unknown errors show -- and setup/error, never 0/fake72/weather. Cache and in-memory data private, no logs coordinates. Save selected location and cache private; exclude weatherlocation/cache from Android backup.
          
          Nothing_Temp actual source: EXAGON six-sided bg side=min(w,h), corners side/9; source has missing h global so document square fitted native adaptation. Center vertical stack margin14. Large text side/3.5 is wf(min,0) degrees+unit, meaning today's forecast low, not current temp. Small source is H:min L:max, which reverses labels. Repair obvious typo to H:max L:min; document exact change, do not silently mislabel min as high. Platform sans substitutes proprietary NType fonts. Forecast source today matched by selected city's local date, not device timezone. Must show unavailable if no matching day/nonfinite. Below/within readable status show city, forecast day and fetched time, stale/error if needed. Render adaptively fits all sides; black source dark1B1B1D fgwhite, translucent whiteA6/darkink, transparent no bg whiteink. Sourcebackground filled hexagon only black/translucent. Text must not clip at small/tall/wide actual host; use existing WidgetSizing sensible min dimensions.
          
          Sun_Info source277viewport: top label SUNSET when ai(isday)=1 else SUNRISE; source time hh:mma for corresponding solar event; native calculate isday from valid cached sunrise/sunset using current instant and selected city zone, not stale current.isDay; choose relevant next sunrise/night, sunset/day, all from real forecast. Show upcoming event correct at night before sunrise/after sunset/date rollover; unknown/polar event => unavailable not dummy. Center geometry source outer accent half-circle width260, redhalf-circle200, horizontal redbase side/1.3, arrow redwidth1 height36 at top/bottom dependingday/night,44?inspect actual code numbers not invented. Under arc3accent lines widths side/1.6,/2,/3 with16scaledstack gap; source18label and26time. Bg rounded rectangle corners side/5, missingh documented fitting adaptation. No copiedfont/icon. Draw original source shapes in Canvas supported ImageView RemoteViews, text from realcache and fitted; source sunrise/sunset tapCalendar adapted whole widget to weather setup/refresh info clearly documented. Gallery previews before setup display honest configure placeholders with neutral geometry, not fakevalues. Add under each individual preview. Weather category includes both and ownReady counts; new modes concise meaningful label not technical internal provider name.
          
          Use sanitized sourceJSON preserving all formula/toggle/geometry facts, remove author email/events/fonts/file refs and binary resources. Attribution Kustom source MIT OmGupta2024, Awesome source adapted path and license as existing attribution; Open-Meteo CC-BY4 attribution visible in appweatherdialog and docs with links https://open-meteo.com/ https://open-meteo.com/en/terms . Do not call ready/runtimeverified until externalnativeplacementtest. Tests: weatherparser/cache roundtrip/invalid/nonfinite/null/timezone/date/nonzero unit, sourceformula geometry, stale/disabled/error, settingsrevoke/locationrace, no network withoutoptin, forecastlow vs Hmax/Lmin, nextsolar day/night/rollover/polar. Build/unit/lint laterworkflow. No testsfirstloop, finishcodewithin9min. Avoid extra dependencies use existing platform. No launcher/production/repo visibility/history changes or paidservices. Update ledger18/40 plus6Awesome=24 buildchecked/runtimepending, retain transparent caveats. Prior22checkpoint staysavailable.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          rm -f checkpoints/dotwel-widgets-polish-debug.apk checkpoints/POLISH-SHA256SUMS
          pkill -f '[K]otlinCompileDaemon' || true
          bash ./gradlew --stop || true
          rm -rf app/build/kotlin
          bash ./gradlew assembleDebug testDebugUnitTest -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
