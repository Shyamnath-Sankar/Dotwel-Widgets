name: Add source Analog native seconds clock
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0e2a534e21564800a8d13bef8a3f0fec38dca8c4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/analog-seconds-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          curl -fsSL https://raw.githubusercontent.com/AumGupta/KWGT-Widgets/96ca27be4cbff35efec5a86c64dd39fd065c958f/widgets/Nothing_Analog_.kwgt -o /tmp/analog-seconds.kwgt
          mkdir -p /tmp/analog-seconds-preset && unzip -oq /tmp/analog-seconds.kwgt -d /tmp/analog-seconds-preset
          cat > /tmp/widget-task.txt <<'TASK'
          Implement ONE actual-source Nothing_Analog_ from /tmp/analog-seconds-preset/preset.json as separate KwgtAnalogSecondsWidgetProvider,20th provider. Preserve all19 existing providers/renderers unchanged. API31+ native AnalogClock supports android:hand_second, OS handles visible second ticking without app/service/alarm. Current minSdk26 MUST remain, target36 unchanged. IMPORTANT no silently degraded source onAPI26-30: hide Add/mark unsupported for this entry there, provider disabled using bool false in values and true values-v31; native widget metadata/layout valid for old install but no offered provider. Layout v31 with actual second hand, base safe layout unreachable. Clock category browse includes it on31+, clear Android12+ source-seconds label and runtime-unverified until external native gate. No permission/dependency/fonts/art/newalarms/services. Source geometry viewport277, side=min(w,h): filled dial circle bg1B1B1D; hour filled capsule width277/11.54 height277/3.378 centeredY138.5-(277/4.616)/2 with source white hour; minute gray6C696E capsule width277/27.7 height277/2.473 centeredY138.5-(277/2.7426)/2; redD71921 second CIRCLE diameter277/23.08 centered on top at radius(277/1.145)/2, rotated by native clock CLOCK_SECOND with source90offset correction accounted: zero seconds must12oclock (left circle source stack then90rotation -> top). All full277viewport drawables centered native clock. Native android:hand_second only in v31 layouts. Source second mode formula CLOCK_SECOND is ACTIVE toggle10, do not omit or freeze. Source config_scale_value overriddeninactive toggle0, use277 normalization documented. Source clean JSON exclude author email, tap intents, fonts, archives. Gallery same native layout liveclock, Add native placement, catalog id kwgt_analog_seconds_clock, native clock id same. Three styles as prior: Black darkdial/whitehour grayminute; Translucent palealpha/darkhour grayminute; Transparent nofill/whitehour grayminute, redseconds constant. Document manual style contrast. API31+ seconds fps is system configured and may be disabled by OS, don't guarantee device universal seconds. No silent SDK raise. Native seconds must later be tested process killed over several seconds; not countverified now. Add precise geometry/resourcetag/APIavailabilitytests, preserve existingtests. Ledger14/40,20providers runtime-unverified, note pre31unsupported for exactsecondsource. Keep other deferred sources deferred. Update STATE/readme with caveats. Code first then tests, finish within8minutes. Do not suppresslint; no production launcher visibility historyedits. Free-only. Final candidate hash authoritative from workflow after actualbuild, no guessedhash.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          rm -f checkpoints/dotwel-widgets-polish-debug.apk checkpoints/POLISH-SHA256SUMS
          pkill -f '[K]otlinCompileDaemon' || true
          bash ./gradlew --stop || true
          rm -rf app/build/kotlin
          bash ./gradlew assembleDebug testDebugUnitTest -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
