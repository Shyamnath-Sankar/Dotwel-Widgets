name: Add actual Analog2 tick and seconds clock
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a583e997139617aaf3fe3d4b759d5673cdd0db05
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/analog2-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          curl -fsSL https://raw.githubusercontent.com/AumGupta/KWGT-Widgets/96ca27be4cbff35efec5a86c64dd39fd065c958f/widgets/Nothing_Analog_2.kwgt -o /tmp/analog2.kwgt
          mkdir -p /tmp/analog2-preset && unzip -oq /tmp/analog2.kwgt -d /tmp/analog2-preset
          cat > /tmp/widget-task.txt <<'TASK'
          Implement ONE actual-source Nothing_Analog_2 from /tmp/analog2-preset/preset.json as separate KwgtAnalog2WidgetProvider21st. Preserve all20existing providers/geometry exactly, including concise seconds descriptions. Native API31+ AnalogClock hand_second now independently proved actual redsecondsmove afterappkill. Appmin26unchanged; newsource exactseconds entry/provider ONLY31+ as priorsecondsavailable bool and UNAVAILABLE catalog pre31, no silentlydegraded seconds. Reuse proven native277fullviewport/styles architecture but distinct trueAnalog2geometry: filled bgcircle277; hour RECTwidth6height74 centeredY138.5-64/2, NOcorners; minute RECTwidth6height100 centeredY138.5-112/2, sourcewhite/darkforeground (global minute formulaACTIVEtoggle10 overridesgray). Redseconds RECTsourcewidth130,height3,left-stack paddingright100 thenCLOCK_SECOND90offset: nativezero vertical atx138.5 centeredY88.5, extentY23.5..153.5,width3. Nativeclock rotates eachsecond OSfps. Source ticks painted AFTER hands means need actual overlaynotdialbehindhands:12hourrect8x16.5 circle style_size250,60minrect11x8 circle style_size258, sourcehourink, then redcenterShape defaultCIRCLE diameter16 finalontop. Keep sourceZorder by transparentoverlay ImageView fullmatchparent fitCenter using277vector ticks+redcenter aboveAnalogClock; ensure sameactualviewport scaling at non-squarehost. Need pin/resize externalverification later. Tick placement use existing sourceProgressModulesemantics fromAnalog5 port: evenlyrotatedrects at appropriate ring radius validated againstpresetmetadata. Document anyuncertainty notinvent. Staticdial onlycirclebg; hours/minutes/seconds rotate natively; overlaytickscannotbe transformedbytime. Three stylesblackdarkbg/whiteink,translucentpalealpha/darkink,transparentnodial/whiteink; redsecondsconstant. Source minute width has toggledformula missing: raw6correct. Center redshape missingtype defaultsCIRCLE perKustom, verifyor document fallback ifuncertain. Source279? inspectactualsource beforecoding. Gallerysame layout; userdescriptionmax45words, noformulas/technicalAPIs/sourcepathwall/staleruntimeclaims; Android12+anddevicesecondssettingcaveat. CatalogClockentryAdd/manifest/updaterpin labels distinct KWGT Analog2, idkwgt_analog2_clock. SanitizeJSONremoveemail/tap/fonts/assets; retainformulas+toggles. AttributionMITledger15/40and21providers buildverifiedpendingruntime, rightsunchanged. TestsAPIavailability,all3layoutsRemoteViewstagallowlist,exactgeometry72ticks/redcenter/Zorderandresponsivealignment. No permission/dependency/alarm/service/fonts/artwork/networkchanges. No testsfirstloop. Buildunitlintsequential. Finishcode8min. No launcherprodvisibilityhistoryedits.Freeonly. Finalworkflowhashauthoritative. Keep current20checkpoint available.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          rm -f checkpoints/dotwel-widgets-polish-debug.apk checkpoints/POLISH-SHA256SUMS
          pkill -f '[K]otlinCompileDaemon' || true
          bash ./gradlew --stop || true
          rm -rf app/build/kotlin
          bash ./gradlew assembleDebug testDebugUnitTest -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
