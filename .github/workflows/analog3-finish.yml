name: Finish Analog3 native clock implementation
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 247227700167af8f1147856b54c54b1cebb29296
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/analog3-finish-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          curl -fsSL https://raw.githubusercontent.com/AumGupta/KWGT-Widgets/96ca27be4cbff35efec5a86c64dd39fd065c958f/widgets/Nothing_Analog_3.kwgt -o /tmp/analog3.kwgt
          mkdir -p /tmp/analog3-preset && unzip -oq /tmp/analog3.kwgt -d /tmp/analog3-preset
          cat > /tmp/widget-task.txt <<'TASK'
          IMPLEMENT NOW, no tests-first or longplan. Priorattempt consumed10minwritingonlytests thenparallelgradledaemonlock. Base16verified2472277, no priorAnalog3files. Readactual /tmp/analog3-preset/preset.json once. Writeprovider/layouts/vectordrawables/catalogintegration FIRST within5min, testsafter. Separate KwgtAnalog3WidgetProvider native android.widget.AnalogClock in XML RemoteViews allowedplatformclass. Three styles layouts black/translucent/transparent withvectorfilledcirclebg1B1B1D/whiteA6/none, whitehandsblackandtransparent, darkhandslight. Sourceviewport277square, dialradius138.5; hour/minutehandfull277transparentcanvas pivot138.5. Hollowroundedpill width20, stroke2; minheight277/2.475 centeredY138.5-(277/2.988)/2, hourheight277/3.3765 centeredY138.5-(277/4.4675)/2. Capsule roundedcornersradius10, transparentfill foregroundstroke, nativeclockrotatesautomatically. Source has NOseconds. No fonts/art/newpermissions/services/deps/exactalarms/bitmaptime. Previewinflate exactnativelayoutAnalogClock tosharevectors/currenttime. Sourcecircleand2pillhands only. ProviderbaseViewsusesbackgroundcard bydefault sooverridebuildViews returnsRemoteViewsselectedlayout +clickrootPendingIntent ACTION_SHOW_ALARMS, no setBackgroundResource card. Exact17catalog/manifest/PinResult/WidgetUpdater resources. NativeclockIDkwgt_analog3_clock. ClockcategorynameKWGTAnalog3. SanitizedactualJSON/attribution/ledger11of40/17pendingruntime. Preserveall16renderers+Battery2refresh. Sourceformulasactual, nofuturesecondsreinterpretation. No promiseuntilruntime actualAddHOMEminutehandmovesafterkill/tap/pixels. NativeAnalogClock deprecatedbutavailable, inflationmusttest. UsevectorresonlynoruntimeAnalogClocksetters required. Build via bash ./gradlew assembleDebug -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1 afterwriting. Do notrunparallelgradle. Endcodingby8min; finalworkflowwillunitlint. Ifblockedreportprecise reason, do notleaveonlytests. Freeprivate/launcheruntouched.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          rm -f checkpoints/dotwel-widgets-polish-debug.apk checkpoints/POLISH-SHA256SUMS
          pkill -f '[K]otlinCompileDaemon' || true
          bash ./gradlew --stop || true
          rm -rf app/build/kotlin
          bash ./gradlew assembleDebug testDebugUnitTest -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
