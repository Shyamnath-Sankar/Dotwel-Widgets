name: Import actual Analog5 Transparent clear masks
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 667ff8ff7662494088baced1b3e7bd614d088387
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/analog5-transparent-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          curl -fsSL https://raw.githubusercontent.com/AumGupta/KWGT-Widgets/96ca27be4cbff35efec5a86c64dd39fd065c958f/widgets/Nothing_Analog_5_Transparent.kwgt -o /tmp/analog5transparent.kwgt
          mkdir -p /tmp/analog5transparent-preset && unzip -oq /tmp/analog5transparent.kwgt -d /tmp/analog5transparent-preset
          cat > /tmp/widget-task.txt <<'TASK'
          Implement ONEdistinct actualsource Nothing_Analog_5_Transparent from /tmp/analog5transparent-preset/preset.json, NOTaliasofAnalog5style. Preserve18existingrenderers/nativeAnalog3+5andBattery2lifecycle. NativeAnalogClock proved actualHOME/appkillminute/tap. New19thproviderKwgtAnalog5TransparentWidgetProvider, ClockcategoryentryKWGTAnalog5Clear. Readactualsource includes MINticksstyle_size1.05*side ratherthanAnalog5side, clipcorner side/5 notside/6, firstCLEARoverlaycornerside/6.5 not6.8, secondCLEARside/7. Sourcehasnobg/hglobal, wallpaper-basedfg andconfig_scale157.74908; documentchosenhostsquare277normalized+manualcontraststyle adaptation, nosilentclaimexactsource. Source60minutetickswidth4,height277/5, ringdiameter277*1.05;12hourtickswidth6,height277/4ring277. Cliproundrectwidth277/1.08,height277,corner277/5; firstCLEARoverlaywidth277/1.15 normalizedsquareheighttoitswidth corners277/6.5, afterminuteticks beforehourticks; secondCLEARwidth277/1.3normalizedsquarecorner277/7 clearsallprevious. MusthonorCLEAR actuallytransparent cutouts, nofillbgapproximation. Needvectorclip-pathintersections/evenOdd masks or offlinepolygonboolean geometry: compute statictickpolygons clipped toouterroundedrect, subtract respectiveCLEARroundrect masks; minuteallsubtractbothCLEAR, hoursubtractlastCLEAR. Nestedvectorclip-path with evenOdd hole+outerrectangle; Androidclip-path fillType supportcheck minSDK. No newruntime dependency, staticgeneratedvectors only. DO NOTcopyAnalog5dial unchanged. HourredD71921/fgminute exactsameformulaasAnalog5 reusevectorhands allowed sourceidentical. NativeAnalogClock layoutthree selectedstyles but ALLtransparent, whitefgBLACK/TRANSPARENT darkfgTRANSLUCENT (manualwallpapercontrastoverrideexplained), nofilleddialcard. Previewnativeinflate sameas19source. Catalog/manifest/pin/updaterintegrate, distinctidentitynotalias. Nofonts/art/newpermissions/services/dependencies/network. SanitizedACTUALsourcepreservesCLEAR/formulas removesemail/events; attributionledger13of40/19pendingruntime withh/bgabsence/scale/manualcontrast adaptation. TestsFIRSTNOTallowed writeimplementationthennewtestscountticks/clearhole/clip/ring1.05/corners/fontsprovider/native tags. Existing58testsmustpass. Clear sourceglobalhmissingportchoice documented. TrimnewUIdescription friendly. UpdateSTATEcounts honestlyfinalhashfromPOLISH-SHA256SUMS no inventedruntimeproof. Buildsequentialinprocessnodoublegradle. Endcoding8minthenworkflowbuild; ifunsupportedCLEARreportpreciseblockerinsteadinventingdesign. No launcher/prod/visibility/historyedits. Freeonly.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          rm -f checkpoints/dotwel-widgets-polish-debug.apk checkpoints/POLISH-SHA256SUMS
          pkill -f '[K]otlinCompileDaemon' || true
          bash ./gradlew --stop || true
          rm -rf app/build/kotlin
          bash ./gradlew assembleDebug testDebugUnitTest -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
