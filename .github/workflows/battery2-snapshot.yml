name: Prefer Android battery broadcast snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 351a4f6dc34deaf65d6212f0907d6883eb3118b4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/battery2-snapshot-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          p=Path('app/src/main/java/com/dotwelwidgets/dotwellabs/BatteryWidgetProvider.kt')
          s=p.read_text();a=s.index('        val manager = context.getSystemService');b=s.index('\n    }\n}',a)
          s=s[:a]+"""        val sticky = context.registerReceiver(
                      null,
                      IntentFilter(Intent.ACTION_BATTERY_CHANGED),
                  )
                  val rawLevel = sticky?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = sticky?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                  if (rawLevel >= 0 && scale > 0) {
                      return (rawLevel * 100 / scale).coerceIn(0, 100)
                  }
                  val manager = context.getSystemService(BatteryManager::class.java)
                  val capacity = manager?.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY) ?: -1
                  return capacity.takeIf { it in 0..100 } ?: 0"""+s[b:]
          s=s.replace('BATTERY_PROPERTY_CAPACITY is preferred;','The Android sticky battery snapshot is preferred;').replace('the sticky ACTION_BATTERY_CHANGED broadcast is the fallback.','BATTERY_PROPERTY_CAPACITY is the fallback. This keeps framework and HAL disagreement from overriding the system broadcast level.')
          p.write_text(s)
          p=Path('app/src/main/java/com/dotwelwidgets/dotwellabs/KwgtBattery2WidgetProvider.kt');s=p.read_text();s=s.replace('import android.content.Intent\n','import android.content.Intent\nimport android.content.IntentFilter\n')
          s=s.replace('charging = manager?.isCharging == true,','charging = context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))?.getIntExtra(BatteryManager.EXTRA_STATUS, -1).let { it == BatteryManager.BATTERY_STATUS_CHARGING || it == BatteryManager.BATTERY_STATUS_FULL },')
          p.write_text(s)
          PYFIX
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          rm -f checkpoints/dotwel-widgets-polish-debug.apk checkpoints/POLISH-SHA256SUMS
          bash ./gradlew assembleDebug testDebugUnitTest --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
