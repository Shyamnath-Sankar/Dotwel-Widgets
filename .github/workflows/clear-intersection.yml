name: Fix transparent clock CLEAR intersection masks
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1c5cd21087ac26ec3c96b5a67479075ae4bcb13b
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/clear-intersection-${GITHUB_RUN_ID}"
      - name: Use inverse clip intersection rather than XOR painted holes
        run: |
          python3 - <<'PYCODE'
          import pathlib,xml.etree.ElementTree as E
          A='{http://schemas.android.com/apk/res/android}';E.register_namespace('android',A[1:-1])
          for p in pathlib.Path('app/src/main/res/drawable').glob('dw_analog5clear_dial_*.xml'):
           root=E.fromstring(p.read_text())
           for group in root.findall('group'):
            path=group.find('path');data=path.get(A+'pathData');parts=data.split(' M');hole='M'+parts[-1];ticks=' M'.join(parts[:-1]);path.set(A+'pathData',ticks);path.attrib.pop(A+'fillType',None);group.remove(path)
            inner=E.SubElement(group,'group');E.SubElement(inner,'clip-path',{A+'fillType':'evenOdd',A+'pathData':'M-100,-100 L400,-100 L400,400 L-100,400 Z '+hole});inner.append(path)
           p.write_text(E.tostring(root,encoding='unicode'))
          p=pathlib.Path('app/src/test/java/com/dotwelwidgets/dotwellabs/KwgtAnalog5TransparentLayoutTest.kt');t=p.read_text().replace('vector.getElementsByTagName("group").item(groupIndex) as Element','vector.childElementsRecursively().filter { it.tagName == "group" && it.parentNode == vector }[groupIndex]');t=t.replace('"evenOdd", path.getAttribute("android:fillType")','"", path.getAttribute("android:fillType")')
          start=t.index('    @Test\n    fun clearOverlaysAreRealEvenOddHolesNotBackgroundFills()');end=t.index('    @Test\n    fun sanitizedAsset',start)
          t=t[:start]+'''    @Test
              fun clearMasksIntersectTicksRatherThanPaintXorHoles() {
                  cases.forEach { (_, dial, _) ->
                      val vector = parse("drawable", "$dial.xml").documentElement
                      val clips = vector.getElementsByTagName("clip-path").elements()
                      assertEquals(4, clips.size)
                      val inverse = clips.filter { it.getAttribute("android:fillType") == "evenOdd" }
                      assertEquals(2, inverse.size)
                      assertTrue(inverse[0].getAttribute("android:pathData").contains("42.6154"))
                      assertTrue(inverse[1].getAttribute("android:pathData").contains("39.5714"))
                      inverse.forEach { assertTrue(it.getAttribute("android:pathData").startsWith("M-100,-100")) }
                      val paths = vector.getElementsByTagName("path").elements()
                      assertEquals(60, tickSubpaths(paths[0].getAttribute("android:pathData")).size)
                      assertEquals(12, tickSubpaths(paths[1].getAttribute("android:pathData")).size)
                      paths.forEach { assertFalse(it.getAttribute("android:pathData").contains("A")) }
                  }
              }

          '''+t[end:];p.write_text(t)
          PYCODE
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          rm -f checkpoints/dotwel-widgets-polish-debug.apk checkpoints/POLISH-SHA256SUMS
          pkill -f '[K]otlinCompileDaemon' || true
          bash ./gradlew --stop || true
          rm -rf app/build/kotlin
          bash ./gradlew assembleDebug testDebugUnitTest -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
