name: Consolidated widget repair verification
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-runtime
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v7
      - name: Apply prepared repair to source checkpoint
        run: |
          set -eu
          base64 -d > /tmp/widget-repair-payload.zip <<'PAYLOAD'
          
          PAYLOAD
          git fetch origin 3e0a86002e09e04d090d6733ab07068f9116ca4c
          git checkout --detach 3e0a86002e09e04d090d6733ab07068f9116ca4c
          unzip -o /tmp/widget-repair-payload.zip
          python3 -m pip install --break-system-packages Pillow
          INTERSTELLAR_SRC=tools/repair/endurance-source python3 tools/compile_endurance.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/consolidated-repair-${GITHUB_RUN_ID}"
          git add app tools .gitignore
          git commit -m 'fix: consolidate source imports and collection repairs'
          git push origin HEAD
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
      - uses: android-actions/setup-android@v3
      - name: Verify ordinary artifact
        run: |
          set -eu
          gradle --no-daemon --max-workers=2 assembleDebug testDebugUnitTest lintDebug
          mkdir -p /tmp/ordinary
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/ordinary/dotwel-widgets-debug.apk
          sha256sum /tmp/ordinary/dotwel-widgets-debug.apk | tee /tmp/ordinary/SHA256.txt
          MANIFEST=$(find app/build/intermediates/merged_manifests/debug -name AndroidManifest.xml | head -1)
          test -n "$MANIFEST"
          if grep -E 'RepairHost|RepairMedia|RepairWeather|BIND_APPWIDGET' "$MANIFEST"; then exit 1; fi
      - name: Build opt-in isolated fixtures
        run: |
          set -eu
          gradle --no-daemon --max-workers=2 -PrepairFixtures assembleDebug assembleDebugAndroidTest
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/dotwel-fixture.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk /tmp/dotwel-test.apk
          bash tools/repair/build_snapshot.sh
          sudo chmod 666 /dev/kvm
      - name: Bounded Android host and gallery sweep
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 300
          disable-animations: true
          script: timeout 1250s bash tools/repair/run_emulator.sh
      - name: Preserve screenshots and failure ledger
        if: always()
        run: |
          set -eu
          mkdir -p runtime-evidence
          cp /tmp/ordinary/SHA256.txt runtime-evidence/ordinary-apk-SHA256.txt
          git rev-parse HEAD > runtime-evidence/SOURCE.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "checkpoint/repair-${GITHUB_RUN_ID}"
          git add runtime-evidence
          git commit -m 'test: preserve consolidated repair evidence'
          git push origin HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotwel-ordinary-apk-and-repair-evidence
          path: |
            /tmp/ordinary/
            runtime-evidence/
            app/build/reports/
