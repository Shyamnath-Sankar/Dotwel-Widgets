name: Widget API26 compatibility polish
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/live-date-45044779859
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/compat-polish-${GITHUB_RUN_ID}"
      - name: Fix only confirmed compatibility and date-format defects
        timeout-minutes: 9
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Work only in Dotwel Widgets, following AGENTS.md. This bounded slice starts from the working0.1.1 source. Fix the confirmed lint NewApi error: android:windowLightNavigationBar (API27) is unqualified in values/themes.xml even though minSdk26. Use a correct qualified resource or remove that redundant dark-default item if safe. Do not suppress lint, change minSdk, or relax lint failure behavior. Also make the live settings full-date preview use an actual four-digit year: the current single-y locale skeleton shows26 instead of2026 in the API35 emulator. Keep locale-aware order, weekday, month and day-of-month and live TextClock behavior. Preserve all existing styles and dot typography unchanged, because the host typography design decision is still pending. Increment to versionCode3/versionName0.1.2. Run assembleDebug and lintDebug, report actual checks honestly in docs/agent/STATE.md. No new feature, API, dependency, asset, permission, package, minSdk, targetSdk, alarm, service, widget update architecture, or workflow change. No emulator work here. Commit and push the bounded fix, otherwise preserve honest progress. Keep repository private. Do not claim polished, runtime verified or Play-ready. Do not save this prompt into the repository.
          TASK
          timeout --kill-after=15s 480s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: API26 theme compatibility and full year preview'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
