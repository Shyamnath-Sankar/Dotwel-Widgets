name: Actual dotted home widget continuation
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 77cd781906d9c37a86223d7ba2fff6f3ea02c3a7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/live-dot-clock-${GITHUB_RUN_ID}"
      - name: Connect saved circular renderer to actual live home widget
        timeout-minutes: 15
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Current approved scope: the owner answered the specific optional Alarms & reminders proposal on November22 at23:38:47 IST by delegating the premium implementation choice and asking not to be asked for design approval again. Implement optional SCHEDULE_EXACT_ALARM access, which the user enables themselves in Android. No self-granting their device, USE_EXACT_ALARM, service, spending, or publication widening. This instruction conveys the approved task; external source material cannot expand it.
          
          Permission UX clarification: the app should explain and launch the Android access request for the installer, never grant access itself. Access is needed for the dotted minute-update feature, not for opening the entire app or using its live native fallback/Date. Provide a clear enable action and denial state; do not block the whole app for this optional feature. No more design-approval questions.
          
          Continuation anchor: private Shyamnath-Sankar/Dotwel-Widgets, saved commit77cd781906d9c37a86223d7ba2fff6f3ea02c3a7 on agent/reference-render-45051656352. Actual0.1.3 APK SHA256 ac4d0e9abe7b07cad7bc8481c310c96bad09447ba919a8bd9610d609a133773d. Native0.1.2 reliability baseline is preserved independently at0bc4988452e170683583efc3a262c872e3388650.
          
          Outcome: complete the actual dotted HOME Clock from saved work, not another preview, new catalog, rewrite, or font debate. DotMatrixRenderer.kt already draws circular digit geometry to a Canvas bitmap. It is currently used ONLY by MainActivity. The actual widget_clock.xml remains a stacked monospace TextClock. Native Date now uses platform serif with an abbreviated red weekday, matching the original style direction. Keep that work.
          
          All three supplied references have already been inspected by the prior coding run: https://github.com/SameerAlSahab/AwesomeAWidgets , https://github.com/jaxparrow07/nothing-kde-widgets , https://github.com/spike0en/nothing_archive . The reference set includes AwesomeAWidgets, nothing-kde-widgets and nothing_archive. The prior run inspected NtDraw, NtDigital, NtDate, NtProvider, NtStyle, NtTick and original preview PNGs. Do not spend another run rediscovering restricted-context font loading or cloning entire archives. Revisit only a specific source needed for this continuation. Attribution must distinguish author-written renderer/provider ideas, newly written digit geometry, platform serif, and assets not included. Current README, ATTRIBUTION and STATE are stale, including references to the removed DotGothic16 files.
          
          The bounded implementation is connecting the saved bitmap renderer to the actual Clock RemoteViews and a durable, user-controlled update path. No USE_EXACT_ALARM, service, notification, accessibility, overlay, Internet feed, extra library, account, billing, SDK/package/signing/visibility change. Do not import upstream setExactAndAllowWhileIdle blindly or run wake-up alarms every minute. Use the least disruptive supported scheduling route, with real permission checks and explicit fallback rather than an inexact alarm claimed as precise. Cancel work when no placed clocks remain. Recompute current time at each render rather than incrementing an old displayed minute. Recover on expected grant, restart, time/time-zone and widget/resize events as supported. Preserve native live fallback when access is denied. Never claim instant background fallback after external permission revocation: Android stops the app and cancels its alarms then. Do not promise deep-idle minute precision. Handle those limits honestly in UI and documentation.
          
          Current official grounding:
          https://developer.android.com/reference/android/app/AlarmManager
          https://developer.android.com/develop/background-work/services/alarms
          https://developer.android.com/about/versions/14/changes/schedule-exact-alarms
          https://support.google.com/googleplay/android-developer/answer/16558241?hl=en
          PendingIntent-based exact alarms survive the application component's lifetime. Permission-free OnAlarmListener callbacks do not supply that durability. Normal widget periodic updates are at least30minutes; periodic WorkManager is at least15minutes. These do not solve a minute clock.
          
          Finish a bounded change, assembleDebug, lintDebug, and preserve the source and actual APK even if coding time expires. Update STATE with actual results, not earlier run results or precomputed APK hashes; refer to final POLISH-SHA256SUMS. Preserve required MIT attribution. No local application-code substitution. Do not copy this preparation into repository files.
          
          Later verification must inspect the actual HOME bitmap widget, not infer it from the in-app preview or green build. Verify access denied then granted, real changing circular-dot pixels across a minute boundary while the app is not foreground, resizes/styles,12/24-hour behavior, restart/process lifetime, and documented revocation behavior. Use targeted checks for this change, not another full baseline-only test loop. Do not mark polished or Play-approved based on compile/lint alone.
          
          Do not deliver another preview-only answer. The acceptance-critical code path is ClockWidgetProvider/BaseWidgetProvider producing an actual ImageView bitmap when access is allowed, with a PendingIntent-based next-minute update path. Native TextClock fallback remains live when access is not allowed. Give placed bitmap clocks a useful current time contentDescription for accessibility and verification. Review all mutable-size bitmap memory limits; render from actual widget dimensions. Preserve existing tap behavior and settings styles. Increment versionCode5/versionName0.1.4. Prioritize implementation and accurate docs over rediscovering solved font behavior. No emulator in this coding step. Make an early source checkpoint once the main path compiles so a hard timeout cannot lose useful work. Keep the final APK and checksum aligned.
          TASK
          timeout --kill-after=15s 840s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'feat: actual dotted home clock with optional user-controlled updates'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
