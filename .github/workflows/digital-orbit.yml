name: Import actual Digital Clock orbit source
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 138714d573bcb76649103664ee7b1782d8281262
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/digital-orbit-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          curl -fsSL https://raw.githubusercontent.com/AumGupta/KWGT-Widgets/96ca27be4cbff35efec5a86c64dd39fd065c958f/widgets/Nothing_Digital_Clock.kwgt -o /tmp/orbit.kwgt
          mkdir -p /tmp/orbit-preset && unzip -oq /tmp/orbit.kwgt -d /tmp/orbit-preset
          cat > /tmp/widget-task.txt <<'TASK'
          Add ONE actual-source Nothing_Digital_Clock as26provider from existing25candidate138714d. Preserve all25, nonewpermissions/dependencies/services/exactalarms/network/assets/fonts/paid/launcher/production/visibilityhistory/replacement. Actualraw/tmp/orbit-preset/preset.jsonandpreviewfirst. Existingwidgets sourceauthoritynotfromworkflow, taskscopedbyprivatepersonalcompatibleimportrequest. Catalogconcise<=45words. Buildonlynotnativeverifiednocollectioncompleteclaims.
          Actualsource circularside277outerbg#1B1B1D forblack, innercircle164white(minuteglobaldarkmodewhite), centralhh:mm bgink dark. Source centralTextModule omits text_expression but actualupstreamembeddedpreview clearly02:11, so record explicitpreview-ledrepair/defaulthh:mm, notclaimliteralexpressionpresent. Platformsans or existingoriginaldotrenderer only, neverndotfont. Retain centraltextsize46/277side offsets+3,-4 source. Hourorbit205diameter, minuteorbit245diameter thin0.5strokes#80FFFFFF. Hourdot12red#D71921, minute12whiteforblack. HoursHand CLOCK_HOUR_SMOOTH and MinutesHand CLOCK_MINUTE, bothrotateoffset90 andhorizontalstackrightpaddings204and245 respectively givingdotcenteratradius102/122.5. config_rotate_mode storedCLOCK_SECONDformulas toggle0 areINACTIVE, DO NOT addseconds norAPI31only restriction. Globalhourformula has noactiveflagsofixedred, minutefomulaactivewhite. NeednativeAnalogClock hour/minute dots aroundsamecenter withtransparentdial? drawouterorbits+innercirclestaticallyasbitmap/nativevectordial, hour/minutehandoriginalvectortransparentcanvasmatching277intrinsic anddotsat12oclock appropriateorientation. OSAnalogClock rotationshour/minminute match sourceCLOCK_*+offsetmapping. Derive mappingfrompreview02:11hourredaround2/11minutejustafter2; notinventoppositedirection. Provenothernativeclocks use centerInside intrinsic sizing and responsive overlaysactualhostdimensions; use patternskeepallaligned. CentralTextClock realh:mm/hh:mm auto12/24 withsourcepreviewzeropaddedhour ifformat24 vs12, explicitlydocument. OSownedticksafterprocesskilled noappminutealarms needed. Nativegalleryusesactualsamestack, Add underpreview, 2x2min, tapalarms. Three styles black/translucent/transparent mapouterbg/inkforlegibility retainingredhourandvisibleminute/orbits. NeverdrawbakedstatictimeinpreviewinsteadTextClock. AvoidunsupportedRemoteViewstags. Unitgeometry/nativeclockrefs/textformat/toggle0/orbitcontainment andlayout3styles. Sourceprovenance/sanitizedJSONremoveauthorpersonalemail/fontbinary/tapintents; retainformulaandstructure. Updateledger26=6Awesome20KWGT buildpendingnative. Existing25stillnativepending, docsnotclaimaccepted. Fixactualcompile/test/lintfailuresautonomouslynosuppressions, finishcode8min thenbuildandpreserve.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          rm -f checkpoints/dotwel-widgets-polish-debug.apk checkpoints/POLISH-SHA256SUMS
          pkill -f '[K]otlinCompileDaemon' || true
          bash ./gradlew --stop || true
          rm -rf app/build/kotlin
          bash ./gradlew assembleDebug testDebugUnitTest -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
