name: Finish Digital3 target-aware helper compile repair
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ce464a0c7d9cb25744973256e00053040a1d3baa
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/digital3-helper-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Fix TWO compiler errors in saved ce464a0 only, preserve diagnosedcoordinate/jointwork. No rendererrewrite. build failed because BaseWidgetProvider buildBitmapViews added an optional Function3 target-aware callback LAST, causing ALL existing trailing Function2 lambdas to bind wrongly. Restore exact original protected buildBitmapViews signature (render then decorateFunction2 LAST/default), unchangedbehaviorfor13existingproviders. Make a separate named target-aware helper buildTargetBitmapViews(render,decorateTargetFunction3) forDigital3only, or place optional parameter BEFORE originaltrailingdecorate withoutchangingcallsemantics. Existing13providerfiles mustremainuntouched. Digital3 callsnewhelper. Avoidoverload ambiguity. Second KwgtDigital3Renderer line342 nestedtypealias experimental: removealias anduseconcretetypeor movealiasfiletop-level, NOcompilerexperimentalflag. Then assembleDebug+testDebugUnitTest+lintDebug immediately, fixanynewerrors. No plan/research/repeatedreadloop. Existingdiagnosisrealhostvsscannedrastermustpreserve, sourcejointNEVERhierarchyandthresholdtestsretain. No newpermissions/services/deps/fonts. Freeonly/private/launcheruntouched. Delete staleAPKbeforebuild, reportnotruntimeverified. Finishcodeearlynot10minthinking.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          rm -f checkpoints/dotwel-widgets-polish-debug.apk checkpoints/POLISH-SHA256SUMS
          bash ./gradlew assembleDebug testDebugUnitTest --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
