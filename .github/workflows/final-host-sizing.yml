name: Import two actual KWGT date-time presets
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 27d6e458c1076a6f2cd5520b1492679c1d38aafe
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/kwgt-date-pair-${GITHUB_RUN_ID}"
      - name: Adapt two source KWGT date-time widgets
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Add actual KWGT widget providers to Dotwel, exactly Nothing_Date_Time.kwgt and Nothing_Date_Time2.kwgt from AumGupta/KWGT-Widgets pinned96ca27be4cbff35efec5a86c64dd39fd065c958f. Do this small batch fully, no other cosmetic pass. Current source has8providers/two KWGT battery conversions. User wants KWGT additions then tested APK, full collection remains assigned beyond this pair.
          First download original public pinned repository using git into /tmp/kwgt-original and unzip these two archives. Extract actual preset.json geometry, layers, globals, date/time formulas. Preserve MIT license and provenance by source filename/SHA plus meaningful sanitized preset data. Do not copy embedded font/image assets with unclear rights; use app-owned dot font or system font and explicitly document substitution. Real native adaptation, not a renamed generic existing clock. Distinct compositions from the two presets must remain recognizable, including relative positions and text hierarchy. Do not stop at an inventory or plan, implement now.
          Create two separate registered AppWidgetProviders, resource metadata/initial layouts, meaningful labels, actual renderer implementations, catalog entries and per-card preview/Add, minute scheduler/updater registration, boot/time-change routing as needed using existing shared framework. Derive real device time/date. Reuse fixed Quotes callback and World native-live behavior. Optional alarm access only, no new permissions/service/access escalation: denied mode must be genuine native live TextClock composition, not frozen bitmap. Enabled mode source-derived styled minute bitmaps, label seconds adaptations honestly. Don't silently alias to existing digital/date. Existing UI two-column/filter/Add accessibility remains. Native Add names must be distinct and source identifiable. Keep current preview UI truthful for selected mode.
          Build assembleDebug/lintDebug with no suppression and keep provider count accurate (expected10if both completed). Update40preset ledger only for actual completed implementations, retain remaining unfinished rows. Save final APK/checksum after final source. No runtime/bugfree claims in source state. Source only coding runs on free tool here. Repo private, NothingWidgetPort excluded, launcher untouched. Commit first working preset before second if needed, avoid broad refactor and broad research. Pin original source before copying data.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
