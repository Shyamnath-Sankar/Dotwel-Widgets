name: Offline KWGT collection continuation
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c29668f6e59e5b7d0659fe7ae14872d02b8f7b23
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/offline-collection-${GITHUB_RUN_ID}"
      - name: Adapt offline KWGT presets into native providers
        timeout-minutes: 16
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Continue actual requested collection from preserved buildable gallery candidatec29668f6e59e5b7d0659fe7ae14872d02b8f7b23. Repo stays PRIVATE, launcher untouched. NothingWidgetPort explicitly excluded. Existing AwesomeAWidgets and KWGT ports/credits retained. No paid model/service/dependencies. All40KWGT variants remain assigned, do not claim this run completes them. Existing eight providers only staged.
          
          Implement the next manageable offline KWGT variants as real separate Android providers, not aliases or static cards. Inspect original MIT preset.json geometry/formulas at pinned AumGupta/KWGT-Widgets commit96ca27be4cbff35efec5a86c64dd39fd065c958f. Target Nothing_Date_Time, Nothing_Date_Time2, Nothing_Digital, Nothing_Digital2, Nothing_Analog_, Nothing_Analog_2, Nothing_Analog_3 in that order, finish/build a smaller subset well if needed. Fetch public original source through git when not already bundled. Preserve sanitized original geometry/layer/color/time formula data and map each new provider to actual originating preset/file/hash in40preset ledger. Use app-owned dot glyph/system serif/sans where source font rights unclear, explicitly record font substitution. No donor bitmaps/fonts/icons copied. Don't flatten genuinely different compositions into one generic renderer. Label minute-resolution adaptation honestly when original animates seconds; no service/second polling/exact-alarm escalation/new access.
          
          Use real device date/time in preview and HOME. Reuse existing optional SCHEDULE_EXACT_ALARM flow: access off must place genuinely live TextClock/AnalogClock composition, access on styled bitmap minute update using shared scheduler; do not claim bitmap live without access. Add each implemented provider to manifest, picker metadata, updater, scheduler when minute driven, catalog and per-widget preview/Add. Keep dynamic available count honest and40ledger updated. Full upstream20+3 and40variants scope remains, no silently dropping.
          
          Preserve compact gallery and successful digital cancel/plain/access/ordinary-am-kill minute behavior. Independent runtime against current APK has passed those digital gates, not all providers. Existing world/quotes/battery runtime still in flight; don't claim those tested. Existing initial layouts world/quotes use render-error text as default while bitmap hidden, creating poor native picker preview; improve initial/picker display to neutral actual preview or clearly static named placeholder, never an error before renderer runs. Keep true fallback errors truthful. Avoid unrelated architecture refactor, no new permissions/account setup/weather/media access. Battery preview cache currently timebucket5minutes and onResume doesn't invalidate cache on battery state, inspect/correct if quick grounded fix; actual provider update must use current system battery.
          
          Per-card explanatory text is still implementation-heavy. While touching new entries keep it short, user-facing status, put technical/source detail in About/credits. Don't turn this into another UI-only run. Preserve48dp targets and130percent-font layout, existing style on upgrade.
          
          Build assembleDebug lintDebug with no suppression. Final APK and checksum saved only after final sources. STATE refers final checksum file, no intermediate hardcoded hash/runtime claim. Update exact implemented/unfinished list and source evidence. No blanket bugfree or completion claim. Commit small working increments so timeouts preserve buildable progress. Existing package/version0.1.7 versionCode8 unreleased candidate unchanged.
          TASK
          timeout --kill-after=15s 900s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
