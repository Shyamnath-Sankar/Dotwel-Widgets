name: Implement one extracted KWGT date-time widget
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 27d6e458c1076a6f2cd5520b1492679c1d38aafe
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/kwgt-date-single-${GITHUB_RUN_ID}"
      - name: Adapt two source KWGT date-time widgets
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Implement ONE actual new widget now: KWGT Nothing_Date_Time. Current8providers are retained. Do not research another variant, install image tools, inspect thumbnails or spend this run making plans. Original preset already extracted below as exact JSON. Source: AumGupta/KWGT-Widgets MIT pinned96ca27be4cbff35efec5a86c64dd39fd065c958f widgets/Nothing_Date_Time.kwgt. Real source composition: rounded dark square, left-aligned four-line stack: weekday abbrev white, hh:mma redD71921, fullmonth white, ordinalday white. Textsize32all, stackmargin-4, corners58. Adapt actual bounds/formula data from provided JSON. Fontasset ndot-47 not reused, use app-owned DotGlyphFont and record substitution. Native live fallback can use platform TextClocks in same hierarchy, no frozen fake time.
          Read existing BatteryWidgetProvider/ClockWidgetProvider/DateWidgetProvider and renderer/catalog once, then WRITE working files by minute3. Must produce actual source edits before running anything expensive. No further git fetch needed for source, supplied extracted JSON is source evidence. Create new KwgtDateTimeWidgetProvider, metadata/layout, render method for exact four-line composition with real device date/time and ordinal. Add actual catalog row with unique name KWGT Date Time, separate provider not alias, Add/preview, scheduler/updater/boot registration. Access-off live TextClock layout; access-on styled bitmap using existing optional exactalarm flow. No new permissions/services. Preserve prior Quote/World fixes, two-column UI and upcoming entries. New count9if implemented,3/40KWGT. Finish first usable provider, then build, no second variant. Commit working source before documentation. Leave fullcollection incomplete honestly. Repo PRIVATE, launcher untouched, NothingWidgetPort excluded, freeonly.
          Preserve MIT notice and include sanitized source geometry/formulas in docs/source file; never copy original font/photo. Final build/lint save checksum, no runtime claim. If compile errors fix them within run. Native previews must not show rendererror by default.
          
          EXTRACTED ORIGINAL PRESET DATA:
          {"preset_root":{"internal_type":"RootLayerModule","globals_list":{"side":{"index":5,"type":"NUMBER","title":"side","min":0,"max":720,"toggles":10,"global_formula":"$if(si(rwidth)>si(rheight), si(rheight), si(rwidth))$"},"bg":{"index":6,"type":"COLOR","title":"bg","toggles":10,"global_formula":"$if(si(darkmode)=0, #FFFFFFFF, #FF1B1B1D)$"},"fg":{"index":7,"type":"COLOR","title":"fg","toggles":10,"global_formula":"$if(si(darkmode)=1, #FFFFFFFF, #FF1B1B1D)$"},"primary":{"index":8,"type":"COLOR","title":"primary","value":"#FFD71921"}},"viewgroup_items":[{"internal_type":"ShapeModule","internal_title":"Bg","internal_toggles":{"shape_width":100,"shape_height":100,"paint_color":100,"shape_corners":10},"internal_globals":{"shape_width":"side","shape_height":"h","paint_color":"bg"},"shape_corners":58,"internal_formulas":{"shape_corners":"$gv(side)/5$"},"paint_color":"#FF1B1B1D"},{"internal_type":"StackLayerModule","internal_title":"Info","config_margin":-4.0,"internal_toggles":{"position_offset_x":0},"internal_formulas":{"position_offset_x":"$gv(side)/8.5$ "},"internal_globals":{"position_offset_x":"side"},"viewgroup_items":[{"internal_type":"TextModule","text_expression":"$df(EEE, a)$","text_family":"kfile://org.kustom.provider/fonts/ndot-47.ttf","text_size":32.0,"internal_toggles":{"paint_color":100,"text_size":10},"internal_globals":{"paint_color":"fg"},"internal_formulas":{"text_size":"$gv(side)/7$"},"internal_events":[{"type":"SINGLE_TAP","action":"LAUNCH_APP","intent":"intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;component=com.google.android.calendar/com.android.calendar.AllInOneActivity;S.org.kustom.intent.label=Calendar;end"}]},{"internal_type":"TextModule","text_expression":"$df(hh:mma)$","text_family":"kfile://org.kustom.provider/fonts/ndot-47.ttf","text_size":32.0,"internal_toggles":{"paint_color":100,"text_size":10},"internal_globals":{"paint_color":"primary"},"internal_formulas":{"text_size":"$gv(side)/6$"},"paint_color":"#FFD71921","internal_events":[{"type":"SINGLE_TAP","action":"LAUNCH_APP","intent":"intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;component=com.google.android.deskclock/com.android.deskclock.DeskClock;S.org.kustom.intent.label=Clock;end"}]},{"internal_type":"TextModule","text_expression":"$df(MMMM)$","text_family":"kfile://org.kustom.provider/fonts/ndot-47.ttf","text_size":32.0,"internal_toggles":{"paint_color":100,"text_size":10},"internal_globals":{"paint_color":"fg"},"internal_formulas":{"text_size":"$gv(side)/7$"},"internal_events":[{"type":"SINGLE_TAP","action":"LAUNCH_APP","intent":"intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;component=com.google.android.calendar/com.android.calendar.AllInOneActivity;S.org.kustom.intent.label=Calendar;end"}]},{"internal_type":"TextModule","text_expression":"$df(d)$$tc(ord, df(d))$","text_family":"kfile://org.kustom.provider/fonts/ndot-47.ttf","text_size":32.0,"internal_toggles":{"paint_color":100,"text_size":10},"internal_globals":{"paint_color":"fg"},"internal_formulas":{"text_size":"$gv(side)/7$"},"internal_events":[{"type":"SINGLE_TAP","action":"LAUNCH_APP","intent":"intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;component=com.google.android.calendar/com.android.calendar.AllInOneActivity;S.org.kustom.intent.label=Calendar;end"}]}]}]}}
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
