name: Quotes and World runtime defect repair
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c29668f6e59e5b7d0659fe7ae14872d02b8f7b23
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/provider-repair-${GITHUB_RUN_ID}"
      - name: Repair confirmed Quotes crash and World denied-access time
        timeout-minutes: 9
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Make these two concrete runtime repairs NOW on current private widget candidate. Do not spend the budget planning or exploring unrelated collection. No new providers/UI redesign this run. No paid/new dependencies/permissions, launcher untouched. Keep0.1.7/versionCode8 unreleased, source attribution/licenses intact. Commit each working repair. Then assembleDebug lintDebug. Do not claim runtime success.
          
          1. Confirmed actual Quotes crash in API35 host with exact-size options: QuotesWidgetProvider.buildViews returns buildBitmapViews then calls views.setOnClickPendingIntent on that combined size-map RemoteViews. Android throws: combined orientation/size RemoteViews cannot be modified. Construct PendingIntent before buildBitmapViews and set quote tap on every child inside decorate callback. Search any other code modifying combined views and correct same concrete pattern only. Retain real daily quote and tap-to-next behavior. Need per-instance host sizes still supported.
          
          2. Confirmed actual World Clock stale with exact access OFF. WorldWidgetProvider always renders bitmap while MinuteTickScheduler.schedule cancels without access. Actual HOME07:29 shows world07:28. Implement live native two-zone TextClock fallback with chosen zone IDs and labels when access denied, widget_world layout fields for actual timeZone; no frozen bitmap pretending live. Enabled mode keeps translated NtWorld bitmap rendering/shared minute schedule. Update gallery World preview likewise truthful current mode, concise enable setup/action where appropriate while preserving zone chooser and per-instance token config. On return from permission settings update all. No selfgrant, service, USE_EXACT_ALARM, or new permission. Existing digital denied/plain and allowed/dotted contract must remain unchanged. Fix onDisabled cancellation for minute providers only if clearly canceling all other placed minute widgets; prefer schedule() recalculation instead of unconditional cancel when other providers remain.
          
          Original user additionally wants a reference-style2column dotted/red gallery and better actual widgets. Do NOT do that design in this repair run, stabilize first and record pending. Full AwesomeAWidgets+40KWGT collection remains assigned/incomplete, current8providers not completion. Previous broad15minute coding attempt made zero source changes; avoid repeating exploration. Return actual small edits promptly. Final external workflow rebuilds and preserves checksum after all sources, STATE should refer that checksum not hardcode intermediate. No private transcript or prompt details in app/docs.
          TASK
          timeout --kill-after=15s 480s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
