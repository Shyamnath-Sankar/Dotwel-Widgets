name: Final host sizing and copy polish
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5ebaae967efb6110c1d11a5e43130ee3457dd7ac
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/final-host-sizing-${GITHUB_RUN_ID}"
      - name: Correct actual host sizing and final copy
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Continue only the bounded final sizing/copy/documentation polish of saved Dotwel Widgets0.1.4 commit5ebaae967efb6110c1d11a5e43130ee3457dd7ac. Do not restart, revisit fonts, change update architecture or add features/permissions/dependencies/services. The actual HOME circular bitmap clock is now independently proven to change07:06 to07:07 after background process2973 was killed (pid then empty). Native Date/red weekday and the real Android optional access grant screen also work. Those results are preserved at checkpoint/dot-core-45058243427. Preserve this functioning code.
          
          Actual pixel defect: at the default two-cell HOME card size, the dotted clock occupies only about110x175 pixels in a roughly300x390-pixel visible card, while the serif Date is proportionate. The dots have too much empty space compared with the supplied AwesomeAWidgets reference. The in-app preview is larger, so do not substitute it for the host result. ClockWidgetRenderer.targetPixels currently combines OPTION_APPWIDGET_MIN_WIDTH with OPTION_APPWIDGET_MIN_HEIGHT. These are range minima, not necessarily a valid same-orientation size. The precise contribution of that mismatch still needs validation, so do not fix this by arbitrary huge glyph scaling or remove margins until something clips.
          
          Correct the actual host bitmap sizing using the supported host geometry. Android12+ exact/responsive RemoteViews layouts and OPTION_APPWIDGET_SIZES are the documented route; legacy range-based estimates need coherent portrait/landscape pairing. Keep memory bounded across any size variants, preserve transparent backgrounds, keep the existing tap action, and do not add libraries. Draw within the actual ImageView content bounds including its padding, not a twice-inset synthetic canvas. Preserve native live fallback and the proven next-minute scheduling path. If useful, a debug-only, non-private size diagnostic can record the selected host sizes for subsequent emulator verification, but do not add unrelated logging.
          
          Official source checked:
          https://developer.android.com/develop/ui/views/appwidgets/layouts
          https://developer.android.com/reference/android/appwidget/AppWidgetManager
          The first explains why legacy min/max range estimates are not always accurate and documents exact layouts keyed by SizeF. Read only what this small correction needs; do not clone/reinvestigate all three reference repos again. Existing author attribution and no OEM font/artwork copying remain requirements.
          
          Also fix this exact inspected UI copy defect: values/strings.xml exact_alarm_explainer contains literal backslash-x2019s, which compiles and appears as appx2019s on screen. Rewrite in plain words without apostrophe escapes. Add a concise honest deep-idle delay note to the relevant user-facing explanation. Avoid unconditional exact-minute promises while deep idle can defer updates, but do not burden the normal UI with a technical essay. Access remains optional for the dotted update feature, requested through Android by the installer. Do not block the whole app or Date on denial, and do not promise instantaneous fallback when Android externally revokes access and stops the process.
          
          README/STATE currently record or imply stale pre-final-rebuild hashes. Remove fixed APK hash claims from prose and point to final checkpoints/POLISH-SHA256SUMS, since the deterministic workflow rebuild is authoritative. Preserve the current0.1.4 checkpoint on its existing branch. Update only relevant renderer/provider/layout, string copy, version and docs. Increment to0.1.5/versionCode6. AssembleDebug and lintDebug without suppressions. Preserve source/APK promptly even at timeout. Document what was actually checked, with actual-home final visual verification still pending rather than calling compile/green polished or Play-approved. Do not change workflow, package, SDK, signing, visibility, scheduler permissions or alarm behavior. Do not save this task prompt into repository documents.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: host bitmap sizing and final user-facing copy'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
