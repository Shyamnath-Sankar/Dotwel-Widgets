name: Repair collection build and begin actual KWGT preset ports
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/upstream-render-45119082732
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/collection-repair-${GITHUB_RUN_ID}"
      - name: Repair build and port supported preset logic
        timeout-minutes: 19
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Continue saved actual AwesomeAWidgets adaptation on branch agent/upstream-render-45119082732 (237d043). Repair build first, preserve actual translated code and working native pin/host sizing. Do NOT redesign from scratch. Current compile errors all involve buildBitmapViews calls passing two trailing lambdas, invalid Kotlin: render must be an explicitly named parameter inside parentheses, decorate likewise or the sole trailing lambda. Fix all callsites in BaseWidgetProvider, WorldWidgetProvider, QuotesWidgetProvider. Run assembleDebug/lintDebug, fix real errors without suppressions. Current docs/ATTRIBUTION and STATE still describe0.1.6, update honest actual0.1.7 pending-runtime state and precise adapted NtDraw/NtDigital/NtDate/NtAnalog/NtWorld/NtQuotes methods, source commit0fae60722764bda790f89bd94119c6dab854d90e, retained MIT and original glyph/platform serif substitutions. Do not claim full collection finished. Remove any stale inherited0.1.6 APK from this new candidate checkpoints before saving final build, so no old artifact masquerades as0.1.7.
          
          User wants actual code/preset reuse from TWO repositories: SameerAlSahab/AwesomeAWidgets and AumGupta/KWGT-Widgets. NothingWidgetPort excluded. Repo stays PRIVATE, no migration/publication/history rewrite. Full collection, premium gallery, Add directly beneath each preview, stability-first. Current saved source has six proposed providers digital/date/analogBold/analogScale/world/quotes, weather/photo/away/compass/snake pending. Preserve the dots access setup repair and explicit native live fallback. READY means implemented not tested; reflect runtime-unverified clearly, no false full import. Confirm world pre-pin config is correctly transferred using actual appWidgetId, multiple instances independent, canceled pin doesn't leak pending settings. Standard widget picker must provide safe actual config, not silently hardcode misleading city values. Fix if needed within scope.
          
          Do not expand new features before a passing build. After build, use remaining time for actual KWGT preset logic conversion, not more names-only cards. Clone https://github.com/AumGupta/KWGT-Widgets commit96ca27be4cbff35efec5a86c64dd39fd065c958f. Forty widgets/*.kwgt are zip preset.json with layer geometry and formulas, NOT native providers. MIT OmGupta2024, retain notice. Never bundle fonts/icons/bitmap artwork with unresolved separate rights, whole presets/APKs or upstream preview screenshots. Preserve actual author preset layer geometry/formulas in a sanitized JSON data model or readable Kotlin conversion, excluding author emails/intents and separate fonts. Use original circular glyphs/platform fonts; document substitutions. Start with Nothing_Battery, Nothing_Battery2, Nothing_Battery_Mini and iOS_Battery_Widget only if all required live data/action paths are implementable without added permissions; otherwise prioritize Nothing_Digital2, Nothing_Date_Time, Nothing_Mini_Calender. Use actual BATTERY_CHANGED data, no fake charge values. Native pin + actual registered provider per supported layout; native date/time minute update lifecycle reuses existing safe schedule. No paid KWGT dependency, media/notification access, broad storage, GPS or new service. Preserve all40 exact preset names in an honest source-port ledger with implemented/pending/dependency reasons, not a fake finished gallery. Remaining variants remain assigned, not silently dropped. Do not count light/dark preview PNGs as separate presets. Any implemented gallery preview must match its real provider. Keep pending cards disabled, not claim a static placeholder imported.
          
          Weather repository/model files are partial, no nine layouts yet. Keep truthful pending and provider isolation; personal widgets Open-Meteo noncommercial may be used within terms and attribution, launcher separate commercial intent. Do not copy private code to launcher or change launcher. No service/USE_EXACT_ALARM/special permissions for compass/snake. No secret/API key/signup. Current package/versionCode8/0.1.7 retained unless source requires documented change. Preserve existing user style on upgrade. Test source/unit logic where feasible; no screenshot/runtime success claims. Build/lint and save new canonical POLISH APK/checksum only after final source. Keep narrow work bounded; pending functionality explicit. Do not include this brief in docs.
          TASK
          timeout --kill-after=15s 1080s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
