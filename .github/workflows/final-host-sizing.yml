name: Reference-led widget UI and UX
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3d3d637e91488e7f2a2b24a2964806ff46db421f
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/reference-ui-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Implement focused user-requested UI/UX refinement on preserved provider-repair source3d3d637e91488e7f2a2b24a2964806ff46db421f. Do actual edits early and commit increments, no prolonged planning. Current8providers only,2/40KWGT, fullcollection remains unfinished/assigned. Do not add arbitrary features or claim completion. Private repo only, launcher untouched, freeonly, no new permissions/dependencies/services/purchases. Preserve Quotes per-child callback repair and World denied nativeTextClock fallback, existing digital nativepin/cancel/access flow, source licenses. Runtime repair check is independent/inflight, no runtime claims here.
          
          User explicitly supplied Something KWGT Play listing and two screenshots as UI/UX reference. Pixels inspected: dark subtly dotted background; dotted allcap HOME heading; generous rounded two-column category tiles with large preview art and labels beneath; restrained vivid red; floating rounded bottom navigation. Do not copy proprietary images, photos, fonts, icons, code or paid assets. No wallpaper feature, unlock banners, subscriptions/crowns, fake system readout, fake Active count, background-access requests or status clutter. Those are NOT scope. Use app-owned DotGlyphFont to draw a small dotted heading or original custom canvas text with accessible label, system text for body. Use app-owned actual widget previews only. Need genuine product design rather than changing serif text color.
          
          Create coherent compact2column visual widget browser with useful category filters (All, Clocks, Date, Battery, Quotes as backed by actual catalog) and clear About/source access. Every widget retains own preview with Add directly underneath. Touch48dp. Full width detail/preview available when needed, singlecolumn at font130percent or narrowwidth if2columns harms text/buttons. No cropped Add, content not covered by bottomnav/systembar, natural scrolling, readable contrast. Compact optional minute setup, concise truthful mode badge. Move remaining implementation prose such as bitmap rendering into About, short user labels such as Live system clock or Dotted clock. Keep incoming actual accessmode previews truthful for digital/analog/world. Available counts refer real implementations only, no silent hiding unfinished catalog.
          
          Actual HOME visuals show battery ring tiny centered inside tall2x2 surface while most is blank; Mini fills but no numeric charge. Improve actual widget renderers/host sizing, not only gallery. Preserve distinct actual MIT preset geometry/provenance, use proportional fitting/padding so meaningful graphic occupies majority of intended surface without stretch/clipping. Add visible accessible real level where preset has numeric layer, do not invent fake data. Digital dot composition must use consistent circular dots with strong readable scale; analog bold/scale distinct; date hierarchy balanced. Current black/translucent/transparent styles remain. Adapt same renderer for preview and HOME so gallery is honest. No broad font/art import.
          
          Target only manageable polish in10minute budget. No new provider implementation this pass, original fullcollection still future. Existing initial nativepicker error placeholder should become neutral named/static preview if touched, preserve true rendererror fallback. Build assembleDebug lintDebug no suppression, preserve finalAPK/checksum only after all sources, honest STATE with pending tests. Need independent actual pixels atnormal130font + HOME before any delivery. No feature promises in docs.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
