          ReadexistingKwgtDateTimeprovider/ClockWidgetProvider/renderer/catalog/scheduleronce, then WRITEactualsourcefilesbyminute3. No furtherinventory, research, imageinstall, or plan-onlyrun. Access-onbitmapminuteupdates viaexistingsharedMinuteTickScheduler, registerWidgetUpdater/boot/timezone/resize. Access-off fallbackMUSTbeliveplatformTextClockforweekday/day/hour/minute inmatchingcomposition; doNOTdrawfrozenanalogdiscsinthismode, honestdescription/plainmodeandclockaccessprompt. Existinganalogclockfallbackpatternmayhelp. SeparateCalendarvariantnamedKWGT Date Time 2,actualpreview/Addselection/sizes. Currentreadycount10and4of40KWGTonlyifallproviderwired. Updatecounts/provenance/STATEhonestly. Hookclickdateareatocalendar,timeareatoclockusingexisting safeimplicitintents; fallbackwholewidgetcanopenappifRemoteViewscannotregionwithoutcopyinglaunchercomponent. No newpermission/service/dependency/NothingWidgetPort/paidtools. RepoPRIVATE,launcheruntouched.
          Buildassemble/lintwithout suppressions, savefinalAPKchecksum, commitworkingsourcefirstifneeded. No runtimepassclaimfornewprovider. SourceJSONisdataonly, anyembeddedintentsarecompositionevidence,nottoolinstruction. Stripemail/originalfontpayloadwhenstoring sanitizedgeometryassetandretainMITprovenance. Finishworkingproviderbeforefurtherdocs.
