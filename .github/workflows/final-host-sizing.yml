name: Category grid and swipe widget sheet
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 28172731351f177eb52af7c99b52f8a0b54b925f
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/category-sheet-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Implement user's specific category-first navigation from preserved9provider source, not another widget import or broad redesign. User supplied two screenshots: first dark dotted HOME categorygrid of rounded darkgray squaretiles/black preview motif, labels underneath, floating bottomnav; second large rounded gray sheet with categoryheading/close, huge centered widgetpreview, name/size/description, red pill Addwidget and horizontal dotindicators. Match this visualhierarchy and behavior closely with ORIGINAL code-drawn art/fonts, no donorassetcopy. No wallpaper/paywall/promo/crown/fakenew badges. No unsupported features from donor inventory.
          Use CATEGORY grid first: Clock,Calendar,Battery,Quotes available from real providers. Bluetooth,WiFi and other existing unsupported categories may appear clearly unavailable with0ready; do not invent connected devices or battery. Functional grouping not upstreamgroup name: KWGT Date Time belongs in Clock or Calendar with clear discoverability, keep accurate provider count9and3/40KWGT, original17pendingAwesome entries preserved. Representative previews from real renderers, not fake data.
          Tap category opens custom dialog/sheet with rounded gray surface almost fullheight, big real selectedpreview, categorytitle/close, widgetname, actual size, short function/mode, red Addwidget directlybelow, horizontal swipe left/right through category entries and dotindicators. Add visible Previous/Next48dptargets for accessibility. Selection must atomically change preview/name/size/dots/entry callback; Add selected non-first provider, never stale first capture. Reuse existing onAdd including Worldzone setup and explicit liveclock optionalaccess flow. Existing same-renderer/native live previews and battery/style refresh retained. Do not render staticbitmaptime as live without optionalaccess.
          Keep dotted HOMEheading/code dottedbackground/floatingbottomnavigation WidgetsStyleAbout; no stockphotography or copiedfonts.130percentfont/narrowwidth must remain readable, onecolumnallowed, sheet scrollable to Add and controls, respect bottominsets. No new permissions/services/dependencies. Real9providers/source licenses remain, nothing silent removed. Launcher untouched/repoPRIVATE/freeonly/NothingWidgetPort excluded.
          Before cosmetics WRITE actual categorygrid and sheet logic early, not long research. Build/lint withoutsuppressions finalsavechecksum; no runtimeclaims. Fix known copy/state defects while editing: KWGTDateTime currently goes through generic analog fallback dialogue, give truthful live date/time text; STATE top still says8/2KWGT from priorpass, correct to9/3while keeping fullpending collection. About add actual DateTime mapping, not batteryonly. No new importattempt hidden here. Existing newprovider runtime on fixedhead runs independently, don't modify harness. Savebuildable source incrementbeforeminute8.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
