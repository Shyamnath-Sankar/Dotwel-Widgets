name: Truthful compact widget gallery refinement
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6d6b40daec38f073ef4273e814c6912c12bee057
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/gallery-refine-${GITHUB_RUN_ID}"
      - name: Refine truthful gallery and preview lifecycle
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Narrow premium-gallery/readiness correction on preserved buildable candidate6d6b40daec38f073ef4273e814c6912c12bee057. No new widgets this run. Keep eight providers and actual AwesomeAWidgets+two KWGT code/preset adaptations intact, same package0.1.7/versionCode8 for this unreleased candidate. Repo PRIVATE, no visibility/history changes, launcher untouched. Full collection remains incomplete and assigned, do not redefine as eight only.
          
          Actual app screenshot review found front screen is developer-facing and too wordy. MainActivity bindCard shows upstream class/method names and verbose implementation explanations under every preview. Move provenance into a readable About/Source credits dialog or screen, preserving licenses and exact docs attribution; don't remove it from the app entirely. Front screen should be visual browsing: compact title, short subtitle, style chips, compact actionable dotted setup, preview and Add directly beneath each preview, concise status/setup text. Keep touch targets48dp, readable contrast, normal and130percent fonts, natural scrolling. No copied screenshots/art/fonts, use actual existing renderers. App first screen should expose at least the first preview and its Add without a wall of text. No fake Ready/tested promises, use Available if only implementation exists. Disabled pending collection items can be grouped in a collapsed Upcoming section, with honest reason on expansion, not endless giant dashed cards obscuring available collection. Catalog may still include all20+3 items and40ledger, no false finished import claim.
          
          Critical actual bug: WidgetPreviewRenderer CLOCK always renders dotted bitmap even while Alarms access is OFF and card says plain live. Previews must match real current mode and be labeled preview. Use an actual plain TextClock or explicitly live native fallback representation while denied, same composition/contrast as actual fallback. With access enabled use actual dotted renderer; update immediately on return from Android settings. Analog preview likewise represents fallback if styled minute rendering unavailable. No stale bitmap pretending live, no permission selfgrant. Render failure must not report dotted ready. Show enable control before/add flow as currently implemented. Keep native pin/cancel/retry and corrected host sizing, world per-instance config and battery live data untouched.
          
          Investigate any sources of host/UI load visible in source: currently all gallery cards render large bitmaps on main thread even offscreen and every minute, plus renderCard can repost indefinitely after Activity destruction. Bound preview dimensions/pixel memory, render only visible/near-visible available cards or cache stable previews, avoid allocation churn and remove pending callbacks on destruction. Do not recycle a bitmap still displayed during draw. Do not claim the Pixel Launcher ANR was caused by app without evidence; independent runtime captures preinstall host state. Fix only grounded lifecycle/memory hazards, not blind broad rewrite.
          
          Build assembleDebug lintDebug without suppressions, preserve canonical final APK/checksum AFTER final source; STATE must not hardcode intermediate hash because deterministic final workflow can rebuild different bytes. Refer to final POLISH-SHA256SUMS instead. Update actual changes/unfinished tests honestly, no runtime claim, no Play/universal compatibility claim. Keep changes focused and auditable. No paid resources, services/new permissions/dependencies/signing changes. Retain user style on upgrade, no new external data.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
