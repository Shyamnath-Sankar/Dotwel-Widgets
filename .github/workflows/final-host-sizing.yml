name: Finish gradient provider integration
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 130e1dd57d71606a0b1a2fdb12e95f3c5c0a8e32
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/gradient-wire-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Finish incomplete gradient preset import from130e1dd NOW. Renderer/layout/XML/tests already exist but no provider/catalog/strings/manifest so build failed missing strings kwgt_gradient_preview_description and widget_kwgt_gradient_description. Preserve all12workingproviders and current new renderer, do not rewrite/read repeatedly. CreateKwgtGradientClockWidgetProvider modeledonDigital4 provider:render KwgtGradientClockRenderer.render(),fallback STATICrenderStaticBackground()pluslivehh/mmTextClockusingexistinglayoutIDsandactualrendererlayoutgeometry,resize,minuteScheduler exactofffallback. ClocktapACTION_SHOW_ALARMS. Addmissingstrings/providerinfo/manifest/catalogCLOCKsixthvariant idkwgt_gradient_clockpreview+Add/WidgetUpdater/MinuteTickScheduler/boot-timezone-listenerlikeDigital4. MainActivity Alarm setup detection/words matchclocknotdatetime. Preview correctlyrender actualnewgradient. Noaliasclock.
          Codeintegrationfirst3minutes. Rendereralready378lines,NOcosmeticrewriteorcomplexresearch. ConfirmDotGlyphFontactualsignatureparameters not guesses. Runassemble immediatelyfixcompile/resource errors. Rununit/lintifpossible. AddsanitizedJSONandMITprovenance (sourceNothing_Digital pinned96ca27be4cbff35efec5a86c64dd39fd065c958f),STATEhonest13wired7KWGTbutruntimenotverified. FullcollectionNOTdone. Newproviderinheritsoptionalalarmnoautogrant/noadditionalpermissions/services. Currentlocalgitdiffuncommittedbutworkflowsavesprivatebranch. ExistingAPKstaleremoveifbuildfails. Freeonly/private/noNothingWidgetPort/launcheruntouched. Endbyminute9tosavebuildtime. Ordinaryfixesauthorized.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
