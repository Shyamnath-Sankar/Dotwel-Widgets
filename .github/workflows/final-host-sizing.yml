name: Discoverable add widget flow repair
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 18837f7c53bf5fe1ff9493a5bd3a43bd6d4116f0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/add-widget-flow-${GITHUB_RUN_ID}"
      - name: Add foreground native widget pin actions and fallback
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Bounded usability repair on Dotwel Widgets candidate18837f7c53bf5fe1ff9493a5bd3a43bd6d4116f0. Preserve exact working renderer, scheduler, widget providers, sizing/styles, optional alarm UX and all existing permissions. No launcher/pipeline changes or main promotion. User installed0.1.5, opened the app, and could not drag/place the passive previews. Original screenshot confirms this is the app preview screen. Full source confirms there is no Add control or pin request anywhere. The existing native launcher Widgets-picker route worked on Pixel, but that is not an adequate discoverable in-app path. Repair this one issue, not a redesign.
          
          Add clearly visible, accessible Add Clock and Add Date actions near the top of the first screen before large previews and long technical copy. They must work from a foreground Activity via AppWidgetManager.isRequestPinAppWidgetSupported and requestPinAppWidget with the exact corresponding ComponentName. No new permission, service or dependency. Label the previews as previews, not draggable cards. Do not imply they drag across apps. A clear short placement explanation is needed. Keep useful style/refresh/access controls scrollable and available at large font sizes.
          
          The pin API return true only means request supported/sent, NOT that the widget was placed. Never show success until actual placement is confirmed, and do not need a callback merely for its own sake. Cancellation gives no callback, must leave the app usable for retry with no spurious success message. Check support at click time, handle false and ordinary foreground/security errors safely. When pinning is unsupported, show an immediate readable fallback dialog with launcher HOME long-press empty area > Widgets > Dotwel Widgets > choose Clock or Date instructions; don't silently no-op or send user to unrelated Settings. Include Cancel/Back behavior. User's actual OEM launcher remains unknown, do not claim it is broken. No alarm access needed for placing Date or native Clock fallback.
          
          Current platform sources verified:
          https://developer.android.com/develop/ui/views/appwidgets/discoverability
          https://developer.android.com/reference/android/appwidget/AppWidgetManager
          Pinning is supported from API26 when the current launcher supports it. Launcher owns confirmation. No shell-bind shortcut proves this route works. No custom full cross-app drag system needed.
          
          For deterministic unsupported-flow UI verification on an emulator, if needed provide a strictly DEBUG-only test override delivered as an explicit activity intent extra, impossible to affect release behavior and never forcing unsupported behavior by default. Keep it narrowly named and documented in developer verification notes, not an in-app user setting. An existing suitable platform test route is preferable if available. Do not add a new debug/exported component or public permission just for testing.
          
          Increment0.1.6/versionCode7. Build/lint without suppressions. Preserve source/APK promptly. Update candidate docs honestly: actual pin/cancel/unsupported HOME path still needs independent runtime pixel verification; don't mark complete based on build. Retain earlier exact0.1.5 verified checkpoint links and no Play approval caveats. Do not leave a misleading extra version-named APK with different bytes: use final checkpoints/POLISH-SHA256SUMS and POLISH APK as authoritative, generated after deterministic build. Do not copy this task brief into repository docs. No emulator needed inside this coding step; separate focused runtime will exercise actual buttons, native confirm, accept/cancel and fallback. Save bounded fix rather than spend time rereading references or rewriting tested widget logic.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: discoverable native add widget actions and fallback'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
