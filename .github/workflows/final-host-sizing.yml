name: Upstream Android renderer adaptation and dotted setup repair
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c99df10de7a351ddb843d988514a6135862fff13
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/upstream-render-${GITHUB_RUN_ID}"
      - name: Adapt actual upstream renderer and repair dotted setup
        timeout-minutes: 19
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Repair Dotwel Widgets from tested candidate c99df10de7a351ddb843d988514a6135862fff13 using ACTUAL upstream implementation adaptation, not another reference-only original redesign. User11:03 HOME screenshot shows plain stacked11/03 inside oversized black tile; native Add works on his physical phone. User11:04 and11:05 explicitly insists use the GitHub repos already supplied, not merely look at them. Preserve working Add Clock/Date native pin/cancel/retry and separate launcher/pipeline. No main app promotion. Free tools only. Build bounded tangible correction now.
          
          Fetch/inspect exact upstream Android implementation https://github.com/SameerAlSahab/AwesomeAWidgets commit0fae60722764bda790f89bd94119c6dab854d90e. Source AAWidgets/smali_classes3/com/awesomeandro/widgetsplus/nothing/NtDraw.smali, NtDigital.smali, NtDate.smali, NtStyle.smali. Actual MIT author renderer, not OEM net.oneplus classes. Translate/adapt actual NtDraw.SCHEME/color/surface/fit/center/paint/shadow functions and NtDigital.build/NtDate.build composition into readable Kotlin with precise source class/method attribution and retained MIT copyright. Do not merely name upstream then invent a new renderer. Use meaningful translated fitting/baseline geometry/surface palette in the actual HOME path and previews. NtDigital has hour center0.27*H, minute0.73*H, width0.76*W and rowheight0.37*H; NtDraw surface radius0.22*min(W,H), fit measured reference text, center uses reference bounds baseline. Inspect NtDate positions yourself. Reuse what fits rather than blindly force all helpers. Preserve our corrected host size mapping, bitmap pixel bounds and no-double-padding, because upstream NtDraw.size incorrectly combines minimum range dimensions and would regress verified host sizing. Keep our durable safe scheduling lifecycle rather than copy a full APK/service.
          
          All supplied repositories: https://github.com/jaxparrow07/nothing-kde-widgets commitc963a5d89917a94233dc178fe0e655a6c8f0ff45 contains Plasma QML (not Android drop-in); https://github.com/spike0en/nothing_archive commit4deb1ae0edd10259b617caad5f4790d4fb1be2f1 is an index. They were freshly inspected; do not spend this run cloning whole archives again. Archive links DotMatrixWidget (bitmap AlarmManager, same issue) and Essential-Widgets (no clear license found), so don't substitute unrelated projects. Focus on actual AwesomeAWidgets author code adaptation.
          
          Rights boundary: AwesomeAWidgets README credits OEM Ndot/NType/Lettera fonts and OnePlus assets to original owners; root MIT is not a grant over those separate fonts. Do not include upstream APK/OEM classes/logos/fonts/artwork. Retain existing original circular-dot digit geometry and Android serif ONLY as explicit font substitutions in the adapted renderer, not claim they were upstream. No new third-party font hunt. Attribution must list actual translated methods and deliberate substitutions, preserve source commit. Keep bundled author MIT notice. Source code reuse is required, not literal smali binary inclusion.
          
          Primary functional diagnosis: current ClockWidgetProvider only renders dots when ClockTickScheduler.hasExactAccess=true and bitmap success; otherwise shows native TextClock. Screenshot alone does NOT prove user's access state. Fresh native-pin runtime reproduced the plain tile with access off, then dots with access granted. MainActivity hides Enable minute updates BELOW both giant preview cards while first screen says no access needed. Fix this state mismatch: put an immediate compact state-aware Dotted Clock setup control beside/before Add Clock. When access off, explicit plain-live fallback preview/label, clear Enable dotted clock action opening existing Android Alarms/reminders settings. Add Clock before access must explain exact difference and offer enable setup vs explicitly adding plain-live mode vs cancel. Return from Android settings must refresh already placed clocks; show dots only if live access/render succeeds. Date remains addable without access. No auto-grant, permission bypass, stale bitmap presented as live, USE_EXACT_ALARM, foreground service, wakeup-minute alarms, extra permission/dependency/SDK/signing/identity change. Existing SCHEDULE_EXACT_ALARM only. Preserve honest Doze/revocation limits. Rendering failure should be distinguishable enough not silently pretend dotted readiness.
          
          Visual output: actual upstream-derived surface/ink/muted/accent proportions and fitted composition, not giant default app Buttons with unexplained black cards. Keep first-screen compact Clock/Date selectors/actions and style selection discoverable; avoid a wall of technical text before setup, no oversized empty black tile. Use existing available Android widgets/resources, tidy spacing/typography, native-safe touch targets and130% font. Existing three background choices remain functional, with upstream-appropriate contrast (translucent light card with dark ink, transparent white ink with subtle shadow) rather than hardcoded same ink for every style. Preserve user's stored style; do not silently overwrite old settings. New-install default may use upstream black style. Full collection import now explicitly requested. See latest scope below. No pixel proof from app preview alone: independent runtime will check actual HOME denied/granted, setup-return, pin/cancel, styles/minute/size and130% UI.
          
          Increment0.1.7/versionCode8. Run assembleDebug and lintDebug without suppressions. Save source and final POLISH APK/checksum promptly. Don't run repeated clean rebuilds or claim final SHA before the final preservation step; previous coding docs recorded an intermediate hash, independent test caught it. STATE should point to POLISH-SHA256SUMS instead of hardcoding an unverified hash. No divergent version-named APK. Honest pending-runtime docs, no Play approval/universal OEM claim. Do not include this task brief in docs. Separate coding from later emulator runtime; save bounded real upstream adaptation even if incomplete instead of plan-only or another from-scratch rewrite.
          
          LATEST USER SCOPE SUPERSEDES CLOCK/DATE-ONLY LIMITS ABOVE: at11:06 user explicitly requests importing the entire shared collection with Add under EACH individual preview in a premium gallery. Use AwesomeAWidgets ACTUAL Android manifest inventory, not merely two or README marketing count. Actual20 Nothing provider classes: NtAnalogBold, NtAnalogScale, NtDigital, NtWorld, NtPhotoCircle, NtPhotoRect, NtQuotes, NtDate, NtAway, NtCompass, NtSnake, NtWxCircle, NtWxSquare, NtWxRect, NtWxCombo, NtWxSunset, NtWxAir, NtWxW1temp, NtWxW1status, NtWxW1rain. Three OEM OnePlus providers are present but their original OEM code/assets lack independent redistribution grant; list them honestly unavailable rather than bundle OEM code or silently omit.
          
          Implement full catalog data + browsable gallery, grouped sensibly, actual per-widget preview and Add directly BELOW that widget. Do not leave only generic top Add controls. Existing provider component identities ClockWidgetProvider/DateWidgetProvider preserved for upgrades. Actual author-code import/adaptation required for available widgets: translate meaningful upstream render/build methods, not generic placeholder renditions, and retain exact source attribution. Copy verified MIT-author smali source snapshots for actually adapted classes into docs/upstream if useful for auditable provenance, not the entire OEM app. Keep source-port ledger for every catalog item: actual original class/method, translated class/method, asset substitutions, provider added or explicitly pending/blocked, runtime not yet verified. No checkmark or enabled Add for a provider that is not real/functional. Gallery status must distinguish unsupported pending work from completed import.
          
          Implement as much complete, functioning author-code reuse as fits, preserve progress/build rather than pretending the whole collection is tested. Prioritize current actual dots/setup plus gallery and reusable base, then actual offline widgets analog bold/scale, world with timezone config, away-time config, quotes with actual author quote data, photo circle/rectangle using Android system photo picker/private per-widget file. Read upstream implementations and adapt their real logic and visual composition. If configuration cannot be safely completed, show explicit setup-required and don't place deceptive static placeholders. Native pin does not automatically launch configure Activity, so configuration must be arranged in app before native request or via a clearly tested post-placement path. Don't break normal widget-picker config route. No broad media/storage permission: system picker only. No silent uploading photos, weather locations, or secrets.
          
          Weather and live Compass/Snake require a separate policy/dependency decision still pending. Include their exact catalog cards marked not ready with honest reason, do not fake weather values or functioning compass/game and do not copy upstream specialUse FGS, USE_EXACT_ALARM or net.oneplus bridge. Keep all current permission limits until separately approved. This is staged import progress, not a claim the entire collection is delivered. Preserve full desired outcome in STATE. Do not drop or redefine it as permanent two-widget scope.
          
          
          WEATHER OWNERSHIP RESOLVED by coordination11:07: Widgets now owns adapting reusable upstream NtWxData/NtWxFetch/NtWxModel/NtWxDraw + nine layouts, including replacing net.oneplus OpSettings bridge with a small separate settings/data contract. Launcher will consume this source/module later, not wait for deferred app integration. You may implement weather transport with INTERNET (normal permission necessary for requested live weather), existing-free Open-Meteo only, manual city selection via geocoding/no GPS permission, Celsius/Fahrenheit, cache/update timestamp, truthful loading/stale/error states. No fabricated weather, API key or paid service. Isolate reusable weather domain/transport/models from widget UI and publish exact source contract docs for launcher (inputs city lat/lon/name/unit, outputs current/forecast/AQI/sun times, update/caching semantics, error). Do not import OEM OpSettings or claim its provenance resolved. Real network/runtime verification remains independent. Adding network permission is limited to requested actual weather and normal necessary data disclosure to Open-Meteo; do not add unrelated feed/telemetry or broad location.
          
          Live Compass/Snake restriction adjusted: investigating a minimum policy-compliant service is allowed for explicitly requested full catalog, but do NOT add service/restricted permissions without first documenting current official Android/Play rationale and actual need; if cannot ground within this run, keep those two not-yet-implemented with exact dependency and preserve rest. Existing no-USE_EXACT_ALARM restriction stands; user-granted SCHEDULE route stays. Never present an unfinished card as an imported widget. Full catalog remains assigned beyond this run.
          TASK
          timeout --kill-after=15s 1080s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: adapt upstream renderer and explicit dotted setup'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
