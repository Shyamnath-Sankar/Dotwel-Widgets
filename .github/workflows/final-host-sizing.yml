name: Wire saved category grid and sheet into activity
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a40acfeecf0eb0e8232dc9f0dd53486c0bfe05e7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/category-wire-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Finish existing partial category implementation NOW. Helpers already saved/built in a40acfee: WidgetCategory readyEntries/providerInfo/WidgetModeLabels in WidgetCatalog, WidgetPreviewBinder.bind(context,FrameLayout,entry,style) with real native fallbacks, SwipeFrameLayout.onSwipe direction, SquareFrameLayout, CategoryMotifView and bg_category_tile/bg_sheet_surface/bg_add_pill/ic_close/dotdrawables and40newstrings. MainActivity is STILL unchanged old filtered cardlist! This run must WIRE helpers into actual visible navigation, not make more unused helpers or research source. Write MainActivity within first2minutes.
          Replace buildAvailableCards/front gallery with functional categorygrid: two rounded square gray tiles perrow with representative realpreview or CategoryMotifView, categorylabel/count underneath. Dark dotted HOMEheading/floatingbottomnav retained; remove filterchips for categoryfirst. WidgetCategory.values/categories give sources: Calendar date + KWGTDateTime;Clock4;Battery2;Quotes1;unavailable honest0withnoAdd. Preserveupcoming17andall9providers. No newfeature/import/permission/assets. Tapcategory opens custom scrollable rounded gray dialogsheet: categoryheading,48dpclose, hugecentered WidgetPreviewBinder preview within SwipeFrameLayout, selectedname,actualprovider size via providerInfo metadata, honestmode/description,redrounded Addwidgetbutton below,indicator dots,Previous/Next48dptargets. Swipe updates index then rebind ALL name/preview/size/dots/Add callback. Add invokes existingonAdd(entries[selectedIndex]), not firstcapturedentry. Explicitcontrols supportaccessibility. Native Worlddialog and optionalalarm livefallback preserved.130font/narrow allow1column/scrollable sheet/bottominsets. No fakeBluetoothdevicevalues/newbadges/crowns/wallpaperpromos.
          Knownfixes: KWGTDateTime optionalaccessdialog incorrectlyanalog. Specialcase its title/message/plain choice to true live dateandtime. STATEtop still8providers/2KWGT, correct9/3unfinishedhonestly. AboutaddDateTimemapping. Do NOT claim anyruntimepassed; independentfixedheadruntimeongoing. RenderedUIactualpixelgateafter save. Buildassemble/lintnosuppression and finalAPKchecksum. Commitworkingactivitybeforeadditionalpolish. No longanalysis, no thumbnailtools/gitclone. RepoPRIVATE/launcheruntouched/freeonly/NothingWidgetPortexcluded.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
