          CreateKwgtMiniCalendarWidgetProvider(renderer,metadata/layout,preview/catalog/manifest/WidgetUpdater/boot/timezone/datechange/pinresult),separateprovider namedKWGT Mini Calendar,Calendar4thvariant,notaliasDate. Current11ready/5of40KWGTonlyifallwired. No newpermissions/services/dependencies. DateonlydoesNOTneedminuteaccessorCLOCK_ACCESSdialog. Useexistingdateproviderupdate/broadcastpattern,standardAndroidupdatePeriodMillisatleast1800000plusTIME/DATE/TIMEZONE/BOOT/appupdate; documentinexactperiodicmidnightrefreshlimitwithoutoptionalalarmifnotguaranteed. DoNOTcreatemisleadingfrozenfallback: renderdatedsnapshotbuthonestdate-onlyrefreshmode,alwaysupdatereceivedevent/resized. CalendarclickimplicitCATEGORY_APP_CALENDARsameassuccessfullytestedDateTime2,sourcependingintentimmutable. Realpreviewbind,addselectedentrycorrectly. Runtimewilltestpin/tap/datecalculationbeforeclaim.
          Readexistingdate/provider/render/catalogonce,thenWRITEworkingfilesbyminute3. No research/inventory/imageinstall/planonlyrun. ImplementCalendaroffsetpuremathunittests month/yearboundaryincludingDec31andFebleap. Buildassemble/lintwithout suppressionandpreserveAPKchecksum. Updateprovenance/sanitizedsourceJSON/MIT/STATEhonestlybutworkingcodefirst. No runtimereadinessclaimuntilindependentactualpixels. KeepDateTime2andpriorrowspacing/visibleAdd/all10providersunchanged. RepoPRIVATE,freeonly,NothingWidgetPortexcluded,launcheruntouched.
