name: Fix five-day calendar fit in square preview
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 58ba518ec23dc6bd3d953c580d7e30dfc0145473
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/calendar-fit-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          NARROW diagnosed MiniCalendar renderer fit repair only. Existing11provider source58ba518e built/linted. Actual AndroidHOME4x1pixels correctfive-daySat21Sun22Mon23Tue24Wed25/redtodaydot. Actualcategorysquarepreviewhasweekdaysphysicallycolliding: DotGlyphFont.fitPitch thirdparameterwaspassed side/6.291 as iffontsizebutisfontpitch,rendererusedheightfitaloneanddoesnotensuretrueweekdaywidthstaysinsideeachcolumn! Independentactualpixelsmustbeaddressed. InspectDotGlyphFont.fitPitch/drawCentered contractandKwgtMiniCalendarRenderer once, thenfixpercolumnmaxpitchbyactualglyphwidthandbothfontheightconstraints. Onlyrendererandmathlayouttests/provenancenoteifneeded. Keep5columnslegibleinsquaregalleryand4x1HOME. Betterrendernaturalwideaspectcenteredinsquarewithletterboxifnecessary,notstretchedrow. Todayhighlightmustfitrowheightinsteadfullsquarestripesifletterbox. Don'tchangesourcegeom/colors/dateoffsets/provider/clicks/other10widgets. Noruntimeclaim. Run./gradlew testDebugUnitTest --tests '*KwgtMiniCalendar*' andpreservetestXMLincheckpoints/mini-calendar-tests,assemble/lint/APKchecksum. Currentpuredateboundarytestsfilealreadyexists. Needactualcodeeditquickly,notinventory/planonly. Freeonly/private/launcheruntouched/NothingWidgetPortexcluded. Independentruntimewillrecheckpreview/HOME/pin/tap.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
