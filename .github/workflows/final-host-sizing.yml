"internal_formulas":{"text_size":"$gv(side)/10$"}},{"internal_type":"TextModule","text_expression":"$df(d)$","text_family":"kfile://org.kustom.provider/fonts/NType82-Headlineotf.ttf","text_size":32.0,"internal_toggles":{"paint_color":100,"text_size":10},"internal_globals":{"paint_color":"primary"},"internal_formulas":{"text_size":"$gv(side)/4$"}}]},{"internal_type":"StackLayerModule","internal_toggles":{"position_padding_left":10,"config_margin":10},"internal_formulas":{"position_padding_left":"$gv(side)/2.5$","config_margin":"-$gv(side)/23.079$"},"config_stacking":"VERTICAL_RIGHT","config_margin":-12.0,"position_padding_left":100.0,"internal_events":[{"type":"SINGLE_TAP","action":"LAUNCH_APP","intent":"intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;component=com.google.android.deskclock/com.android.deskclock.DeskClock;S.org.kustom.intent.label=Clock;end"}],"viewgroup_items":[{"internal_type":"StackLayerModule","config_stacking":"HORIZONTAL_CENTER","viewgroup_items":[{"internal_type":"OverlapLayerModule","config_rotate_mode":"CLOCK_HOUR_SMOOTH","viewgroup_items":[{"internal_type":"ShapeModule","internal_toggles":{"shape_width":10,"paint_color":100},"internal_formulas":{"shape_width":"$gv(side)/5$"},"internal_globals":{"paint_color":"fg"},"shape_type":"CIRCLE"},{"internal_type":"ShapeModule","internal_toggles":{"paint_color":100,"shape_height":10,"position_padding_bottom":10,"shape_width":10},"internal_formulas":{"shape_height":"$gv(side)/28$","position_padding_bottom":"$gv(side)/6.1$","shape_width":"$gv(side)/69.25$"},"internal_globals":{"paint_color":"bg","shape_height":"side"},"shape_type":"RECT","shape_width":4.0,"position_padding_bottom":25.0}]},{"internal_type":"TextModule","text_expression":"$df(hh)$","text_family":"kfile://org.kustom.provider/fonts/NType82-Regularotf.ttf","text_size":32.0,"internal_toggles":{"paint_color":100,"text_size":10},"internal_globals":{"paint_color":"fg"},"internal_formulas":{"text_size":"$gv(side)/10$"}}]},{"internal_type":"StackLayerModule","config_stacking":"HORIZONTAL_CENTER","viewgroup_items":[{"internal_type":"OverlapLayerModule","config_rotate_mode":"CLOCK_MINUTE","viewgroup_items":[{"internal_type":"ShapeModule","internal_toggles":{"shape_width":10,"paint_color":100},"internal_formulas":{"shape_width":"$gv(side)/5$"},"internal_globals":{"paint_color":"primary"},"shape_type":"CIRCLE"},{"internal_type":"ShapeModule","internal_toggles":{"paint_color":100,"shape_height":10,"position_padding_bottom":10,"shape_width":10},"internal_formulas":{"shape_height":"$gv(side)/12$","position_padding_bottom":"$gv(side)/8.5$","shape_width":"$gv(side)/69.25$"},"internal_globals":{"paint_color":"bg","shape_height":"side"},"shape_type":"RECT","shape_width":4.0,"position_padding_bottom":25.0}]},{"internal_type":"TextModule","text_expression":"$df(mm)$","text_family":"kfile://org.kustom.provider/fonts/NType82-Regularotf.ttf","text_size":32.0,"internal_toggles":{"paint_color":100,"text_size":10},"internal_globals":{"paint_color":"fg"},"internal_formulas":{"text_size":"$gv(side)/10$"}}]}]}]}]}}
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
