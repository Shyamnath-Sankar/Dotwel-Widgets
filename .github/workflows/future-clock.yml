name: Add actual Future Clock native sweep discs
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5fb6fa3cef668fde4a0f3502510aefc4ceefb808
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/future-clock-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          curl -fsSL https://raw.githubusercontent.com/AumGupta/KWGT-Widgets/96ca27be4cbff35efec5a86c64dd39fd065c958f/widgets/Nothing_Future_Clock.kwgt -o /tmp/future.kwgt
          mkdir -p /tmp/future-preset && unzip -oq /tmp/future.kwgt -d /tmp/future-preset
          cat > /tmp/widget-task.txt <<'TASK'
          Add ONE actual-source Nothing_Future_Clock as 22nd provider. Read actual /tmp/future-preset/preset.json first. Preserve all21 previous providers and geometry. Source has rounded RECT bg width hostwidth h=hostheight/1.5 corners58; horizontal centered stack margin18 offsetY-8, three vertical stacks margin-12, each CIRCLE diameterh/2, BLACK to hr red D71921 / min CBCBCB / sec6C696E SWEEP gradient. Minute/second paint globals toggles0 means actual paintBLACK, not bg. Hour CLOCK_HOUR_SMOOTH, minute CLOCK_MINUTE, seconds ACTIVE formula CLOCK_SECOND; each180offset. Labels actual hh hr, mm min, ss sec at24fg. Font ndot proprietary: replace original dot glyph renderer or platform sans, never copyfont. Need live native circles + labels even with appkilled and exactalarms notgranted. Native API31+ AnalogClock proven seconds and centerInside overlay lessons. Feasible design separate native AnalogClock per disc with real SWEEP gradient vector drawable as appropriate single hand; other hand/dial transparent equal intrinsic square so no accidental scale. Native clock rotation handles hour/min/sec; add source180offset within vector geometry or gradient orientation. Ensure 180 mapping exact, not invented, inspect platform gradient zero direction and source rotation convention. Dynamic labels TextClock hh' hr', mm' min', ss' sec', fixed12hour source labels in both12/24formats. NativeTextClock seconds OS cadence no app service. Responsive gallery uses actual native layout. Size to actual host with all three discs+labels contained, preserving source ratios as fit allows, not stale raster size. Existing responsive native layout patterns; no customRemoteViews tags, only supported layout/AnalogClock/TextClock/ImageView. Consider sweepgradient vector support AAPT compile; simple allblack static face not acceptable. If exact nativegradient cannot be supported, document realblocker instead of degrading/faking seconds. API31only newreceiver and catalog availability, appmin26unchanged. Three styles following documented bg/fg mapping, gradients remain sourcecolors; no wallpaper sampling. Native tap Alarms. Add under own gallery preview, sensible wide minsize; concise description under40words Android12+andsecondsdevice setting caveat. Sanitize presetremoveemail/tap/fonts/assets retain formulas+toggles. Update attribution/ledger16of40,22 buildverified pendingruntime; document adaptations and true limits, do not claim runtime pass. Correct existing Analog2 stale fitCenter prose to centerInside; no other scope creep. Tests sourcegeometry/rotation/colors/labels/nativeonly/APIgate/RemoteViewsalltags/resizecontainment. Buildunitlint sequential. No testsfirstloop. Finishcode8min, no dependency/service/permission/exactalarm/production/launcher/visibility/history changes. Freeonly. Current21checkpoint muststayavailable. Actual native host proof will be external afterbuild.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          rm -f checkpoints/dotwel-widgets-polish-debug.apk checkpoints/POLISH-SHA256SUMS
          pkill -f '[K]otlinCompileDaemon' || true
          bash ./gradlew --stop || true
          rm -rf app/build/kotlin
          bash ./gradlew assembleDebug testDebugUnitTest -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
