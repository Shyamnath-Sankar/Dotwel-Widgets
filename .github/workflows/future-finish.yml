name: Finish Future Clock native integration
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2f28f2bb86d59232540825c21bee8fbca9166998
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/future-finish-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          cat > /tmp/widget-task.txt <<'TASK'
          Finish partially implemented actual-source FutureClock22nd from current source. Previous10mincodingtimeout left compile errors: WidgetCatalog.kt unresolved catalog_kwgt_future_desc, ledger_ready_future, PIN_KIND_KWGT_FUTURE, mode_kwgt_future; WidgetPreviewRenderer when missing KWGT_FUTURE. Integrate all missing MainActivityPIN_KIND/pin routes and WidgetUpdater/gallery native preview/manifest/widgets/strings/tests/docs. Inspect current diff and source assets and finish, not restart. Preserve21providers and theirgeometry. Future native3AnalogClock discs must each use only correct hour/minute/second rotating sweepgradient nativehand with equal intrinsic transparentotherhands; labels hh hr/mm min/ss sec liveTextClock, no frozenimage or degraded missingseconds; API31onlyreceiver/catalog, min26unchanged. Source activeSecondsformulaCLOCK_SECOND, all180rotationoffset, circlesdiameterh/2, w=hostwidth/h=hostheight/1.5; offsets/margins/fg/bg/hr/min/sec as sanitized actualJSON. Native dynamicdiameterandlabels/responsivefit must not overrunhost. Check gradient orientation and actualsourcegradientmath. Sourcefonts excluded, originaldotglyphorplatformfont substitution. No newpermission/service/dependency. Fix compile then build/unit/lint, no testsfirst loop. Gallerydescriptionunder40words readable, Android12+andsecondsOS caveat. Updateledger16/40and22buildverified pendingruntime, correctAnalog2fitCenterprose centerInside. Sanitizedsource excludeemail/tap/fonts/assets. Scopefinish only. No launcherprodvisibilityhistory/paid.21checkpoint preserved. Finishcode7min, independent actualhosttestwillfollow.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          rm -f checkpoints/dotwel-widgets-polish-debug.apk checkpoints/POLISH-SHA256SUMS
          pkill -f '[K]otlinCompileDaemon' || true
          bash ./gradlew --stop || true
          rm -rf app/build/kotlin
          bash ./gradlew assembleDebug testDebugUnitTest -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
