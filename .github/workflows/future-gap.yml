name: Fit Future Clock source gaps at narrow sizes
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d4cc522381749e71852278de523ef5e25e80e335
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/future-gap-${GITHUB_RUN_ID}"
      - name: Match native AnalogClock downscale-only geometry
        run: |
          python3 - <<'PYCODE'
          import pathlib,xml.etree.ElementTree as E
          A='http://schemas.android.com/apk/res/android';E.register_namespace('android',A)
          for folder in ['layout','layout-v31']:
           for p in pathlib.Path('app/src/main/res',folder).glob('widget_kwgt_future_*.xml'):
            r=E.fromstring(p.read_text());row=next(n for n in r if n.tag=='LinearLayout' and n.get('{'+A+'}orientation')=='horizontal');cols=list(row);assert len(cols)==3
            for index in [2,1]:
             gap=E.Element('ImageView',{'{'+A+'}layout_width':'0dp','{'+A+'}layout_height':'1dp','{'+A+'}layout_weight':'0.1','{'+A+'}visibility':'invisible','{'+A+'}src':'@drawable/dw_future_clear'});row.insert(index,gap)
            E.indent(r);p.write_text(E.tostring(r,encoding='unicode'))
          p=pathlib.Path('docs/KWGT-LEDGER.md');p.write_text(p.read_text()+'\nFuture Clock: native three equal columns now have 0.1-column responsive gaps, preserving source18 gap relative to h/2 discs at its916x542 reference. On narrow/tall hosts discs fit columns and cannot touch. Actual runtime pending for this repair.\n')
          PYCODE
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          rm -f checkpoints/dotwel-widgets-polish-debug.apk checkpoints/POLISH-SHA256SUMS
          pkill -f '[K]otlinCompileDaemon' || true
          bash ./gradlew --stop || true
          rm -rf app/build/kotlin
          bash ./gradlew assembleDebug testDebugUnitTest -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
