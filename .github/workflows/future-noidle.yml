name: Future Clock no-idle native gate
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-runtime
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d4cc522381749e71852278de523ef5e25e80e335
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Prepare bounded evidence script
        run: |
          python3 -m pip install --break-system-packages Pillow
          cat > /tmp/widget-runtime-smoke.py <<'PYCODE'
          import subprocess as sp,pathlib,time,re,xml.etree.ElementTree as ET,json,hashlib
          OUT=pathlib.Path('runtime-evidence');OUT.mkdir(exist_ok=True);PKG='com.dotwelwidgets.dotwellabs';report={'version':'0.1.8','tests':{},'limits':['Pixel emulator only; pixels need review; not full collection complete.']}
          def adb(*a,check=True):
           r=sp.run(['adb',*a],capture_output=True,timeout=35)
           if check and r.returncode:raise RuntimeError(r.stderr.decode(errors='replace'))
           return r.stdout
          def tree():
           raw=adb('shell','am','instrument','-w','org.dotwel.snapshot/.Snapshot',check=False).decode(errors='replace')
           i=raw.find('<hierarchy');j=raw.find('</hierarchy>')
           if i<0 or j<0:raise RuntimeError('No fresh no-idle hierarchy: '+raw[:250])
           return ET.fromstring(raw[i:j+12])
          def cap(name):
           r=tree();time.sleep(.5);(OUT/(name+'.png')).write_bytes(adb('exec-out','screencap','-p'));(OUT/(name+'.xml')).write_bytes(ET.tostring(r));return r
          def find(r,s,exact=False):
           return next((n for n in r.iter('node') if any((s.lower()==n.get(k,'').lower() if exact else s.lower() in n.get(k,'').lower()) for k in ('text','content-desc','resource-id'))),None)
          def wait_target(s,exact=True):
           for attempt in range(6):
            n=find(tree(),s,exact)
            if n is not None:return n
            time.sleep(.6)
           raise RuntimeError('UI target not ready: '+s)
          def click(n):
           if n is None:raise RuntimeError('Missing UI target')
           b=list(map(int,re.findall(r'\d+',n.get('bounds',''))));adb('shell','input','tap',str((b[0]+b[2])//2),str((b[1]+b[3])//2));time.sleep(.7)
          def home():adb('shell','input','keyevent','3');time.sleep(1)
          def start():adb('shell','am','start','-W','-n',PKG+'/.MainActivity');time.sleep(1)
          def scroll():adb('shell','input','swipe',str(w//2),str(h*8//10),str(w//2),str(h*3//10),'350')
          def button(label):
           start()
           # Reset scroll through activity recreation, without force-stop or alarm cancellation.
           adb('shell','am','force-stop',PKG);start()
           for i in range(12):
            r=tree();n=find(r,label,True)
            if n is not None:return n
            if not any(n.get('package','')==PKG for n in r.iter('node')):raise RuntimeError('App left foreground while locating '+label)
            scroll()
           raise RuntimeError('Gallery control missing '+label)
          def native(r):
           for label in ('Add to home screen','Add automatically','Add widget','Add'):
            n=find(r,label,True)
            if n is not None and n.get('clickable')=='true':return n
           return None
          def locate(needle,name):
           home()
           for i,d in enumerate((0,1,1,1,1,-1,-1,-1,-1)):
            if d:adb('shell','input','swipe',str(w*(8 if d==1 else 2)//10),str(h//2),str(w*(2 if d==1 else 8)//10),str(h//2),'350');time.sleep(.6)
            r=tree()
            if find(r,needle) is not None:return cap(name)
           raise RuntimeError('HOME view missing '+needle)
          def pin(label,name,plain=None):
           click(button(label));r=tree()
           if plain:click(wait_target(plain));r=tree()
           if label=='Add World Clock':click(find(r,'Save and add',True));r=tree()
           cap('native-'+name);n=native(r)
           if n is None:raise RuntimeError('Native prompt missing '+label)
           click(n);time.sleep(1);report['tests']['pin_'+name]='Native confirmation accepted'
          def test(name,fn):
           try:
            print('START '+name,flush=True);fn();report['tests'].setdefault(name,'passed');(OUT/'RESULT.json').write_text(json.dumps(report,indent=2));print('DONE '+name,flush=True)
           except Exception as e:
            report['tests'][name]={'error':str(e)};cap('failure-'+name);raise
          try:
           w,h=list(map(int,re.findall(r'\d+',adb('shell','wm','size').decode())))[-2:];adb('shell','input','keyevent','82');home();cap('00-preinstall-host');(OUT/'preinstall-logcat.txt').write_bytes(adb('logcat','-d','-t','2000',check=False));(OUT/'preinstall-processes.txt').write_bytes(adb('shell','ps','-A',check=False))
           for i in range(4):
            r=tree();n=find(r,'android:id/aerr_close')
            if n is not None:click(n);home()
            elif any(n.get('package','')=='com.google.android.apps.nexuslauncher' for n in r.iter('node')):break
            time.sleep(3)
           else:raise RuntimeError('Launcher readiness failed before app install')
           (OUT/'am-help.txt').write_bytes(adb('shell','am','help'))
           apk=pathlib.Path('checkpoints/dotwel-widgets-polish-debug.apk');report['sha256']=hashlib.sha256(apk.read_bytes()).hexdigest()
           if report['sha256']!='7e30f70ba0ae2f67a11086c0f986df42f3efb677d7712ab8ada4952108463861':raise RuntimeError('Final APK hash mismatch')
           adb('install','-r',str(apk));w,h=list(map(int,re.findall(r'\d+',adb('shell','wm','size').decode())))[-2:];adb('shell','settings','put','system','time_12_24','24');start();cap('01-gallery-top')
           def category(name):
            for retry in range(3):
             adb('shell','am','force-stop',PKG);start();wait_target('Open '+name+',',False)
             for attempt in range(12):
              r=tree();n=find(r,'Open '+name+',')
              if n is not None:
               prior=n.get('bounds');time.sleep(.5);n=find(tree(),'Open '+name+',')
               if n is None or n.get('bounds')!=prior:continue
               click(n)
               try:wait_target('Close category');return
               except RuntimeError:break
              scroll()
            raise RuntimeError('Category did not open '+name)
           category('Clock');cap('02-clock-first')
           for variant in range(20):
            if find(tree(),'Add KWGT Future Clock',True) is not None:break
            click(wait_target('Next'))
           wait_target('Add KWGT Future Clock');cap('03-future-preview')
           click(wait_target('Add KWGT Future Clock'));cap('04-native-future');click(native(tree()));time.sleep(1);report['tests']['native_category_future']='confirmed'
           def hostbounds(r):
            parents={c:p for p in r.iter() for c in p};n=find(r,'kwgt_future_hour_clock')
            while n is not None:
             if all(find(n,k) is not None for k in ['kwgt_future_hour_clock','kwgt_future_minute_clock','kwgt_future_second_clock','kwgt_future_second_label']):
              return list(map(int,re.findall(r'\d+',n.get('bounds',''))))
             n=parents.get(n)
            raise RuntimeError('No common three-disc host')
           r=locate('kwgt_future_hour_clock','home-future-before');bounds=hostbounds(r);report['clock_bounds']=bounds
           report['labels_before']={k:find(r,'kwgt_future_'+k+'_label').get('text') for k in ['hour','minute','second']}
           adb('shell','am','kill',PKG);ps=adb('shell','ps','-A').decode();(OUT/'postkill-processes.txt').write_text(ps)
           if PKG in ps:raise RuntimeError('Application process remains after kill')
           report['tests']['app_process_killed']='verified absent'
           before=adb('shell','date').decode();time.sleep(8)
           r=locate('kwgt_future_hour_clock','home-future-after');after=adb('shell','date').decode();report['labels_after']={k:find(r,'kwgt_future_'+k+'_label').get('text') for k in ['hour','minute','second']};report['live_time']={'before':before,'after':after}
           from PIL import Image,ImageChops,ImageStat
           box=tuple(bounds);im1=Image.open(OUT/'home-future-before.png').convert('RGB').crop(box);im2=Image.open(OUT/'home-future-after.png').convert('RGB').crop(box);im1.save(OUT/'hand-before.png');im2.save(OUT/'hand-after.png');diff=ImageChops.difference(im1,im2);diff.save(OUT/'hand-diff.png');mean=sum(ImageStat.Stat(diff).mean);report['hand_pixel_difference']=mean
           if mean<.03:raise RuntimeError('Native hands did not change after minute and app kill')
           report['tests']['live_hands_after_kill']='cropped hand pixels changed across native minute; requires visual audit'
           report['alarm_access']=adb('shell','appops','get',PKG,'SCHEDULE_EXACT_ALARM',check=False).decode()
           click(find(r,'kwgt_future_hour_clock'));time.sleep(2);cap('tap-result-clock');focus=adb('shell','dumpsys','activity','activities').decode(errors='replace');(OUT/'tap-clock-activity.txt').write_text(focus)
           if 'com.google.android.deskclock' not in focus:raise RuntimeError('Clock app did not open')
           report['tests']['tap_clock']='destination activity recorded; pixels require review'
           needle='kwgt_future_hour_clock'
           def native_bounds(name):
            r=locate(needle,name);return hostbounds(r)
           initial=native_bounds('size-default');report['size_bounds']={'default':initial}
           def resize(axis,amount,name):
            home();b=native_bounds(name+'-before');x,y=(b[0]+b[2])//2,(b[1]+b[3])//2
            adb('shell','input','swipe',str(x),str(y),str(x),str(y),'1500');cap(name+'-handles')
            # Launcher frame extends about 22 physical pixels outside the widget's view bounds.
            if axis=='width':x1,y1,x2,y2=b[2]+22,y,b[2]+22+amount,y
            else:x1,y1,x2,y2=x,b[3]+28,x,b[3]+28+amount
            adb('shell','input','swipe',str(x1),str(y1),str(x2),str(y2),'900');time.sleep(1);adb('shell','input','tap',str(w-30),str(h-250));time.sleep(1)
            after=native_bounds(name+'-after');report['size_bounds'][name]=after
            old=b[2]-b[0] if axis=='width' else b[3]-b[1];new=after[2]-after[0] if axis=='width' else after[3]-after[1]
            if (amount>0 and new<=old+80) or (amount<0 and new>=old-80):raise RuntimeError('Actual '+axis+' did not change: '+str((b,after)))
            report['tests'][name]='actual launcher bounds changed; pixels need review'
            (OUT/(name+'-appwidget.txt')).write_bytes(adb('shell','dumpsys','appwidget'))
           resize('width',-250,'size-narrow')
           resize('height',320,'size-tall')
           resize('width',250,'size-wide')
           resize('height',-320,'size-restored')
           adb('shell','am','kill',PKG);native_bounds('size-final-after-kill')
           (OUT/'appwidget-dump.txt').write_bytes(adb('shell','dumpsys','appwidget'))
          
          except Exception as e:report['error']=str(e);cap('99-fatal')
          finally:
           (OUT/'RESULT.json').write_text(json.dumps(report,indent=2));(OUT/'logcat.txt').write_bytes(adb('logcat','-d','-t','3500',check=False));print(json.dumps(report,indent=2))
          if 'error' in report or any(isinstance(v,dict) and 'error' in v for v in report['tests'].values()):raise SystemExit(1)
          PYCODE
      - name: Build isolated no-idle snapshot test helper
        run: |
          set -eu
          mkdir -p /tmp/snapshot/classes /tmp/snapshot/dex
          cat > /tmp/snapshot/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="org.dotwel.snapshot"><uses-sdk android:minSdkVersion="26" android:targetSdkVersion="28"/><application android:label="Snapshot test helper" android:debuggable="true"/><instrumentation android:name=".Snapshot" android:targetPackage="org.dotwel.snapshot"/></manifest>
          MANIFEST
          cat > /tmp/snapshot/Snapshot.java <<'JAVA'
          package org.dotwel.snapshot;
          import android.app.Instrumentation;
          import android.os.Bundle;
          import android.graphics.Rect;
          import android.view.accessibility.AccessibilityNodeInfo;
          public class Snapshot extends Instrumentation {
           public void onCreate(Bundle b){super.onCreate(b);start();}
           static String esc(CharSequence s){return s==null?"":s.toString().replace("&","&amp;").replace("<","&lt;").replace("\"","&quot;").replace("\n","&#10;");}
           void node(AccessibilityNodeInfo n,StringBuilder s){if(n==null)return;Rect r=new Rect();n.getBoundsInScreen(r);s.append("<node text=\"").append(esc(n.getText())).append("\" content-desc=\"").append(esc(n.getContentDescription())).append("\" resource-id=\"").append(esc(n.getViewIdResourceName())).append("\" package=\"").append(esc(n.getPackageName())).append("\" clickable=\"").append(n.isClickable()).append("\" bounds=\"[").append(r.left).append(',').append(r.top).append("][").append(r.right).append(',').append(r.bottom).append("]\">");for(int i=0;i<n.getChildCount();i++)node(n.getChild(i),s);s.append("</node>");}
           public void onStart(){Bundle out=new Bundle();try{android.app.UiAutomation u=getUiAutomation();android.accessibilityservice.AccessibilityServiceInfo info=u.getServiceInfo();info.flags|=android.accessibilityservice.AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS;u.setServiceInfo(info);AccessibilityNodeInfo root=null;for(int i=0;i<20 && root==null;i++){root=u.getRootInActiveWindow();if(root==null)Thread.sleep(100);}StringBuilder s=new StringBuilder("<hierarchy>");node(root,s);s.append("</hierarchy>");out.putString("xml",s.toString());finish(-1,out);}catch(Exception e){out.putString("error",e.toString());finish(1,out);}}
          }
          JAVA
          SDK="$ANDROID_HOME"
          ANDROID_JAR=$(find "$SDK/platforms" -name android.jar | sort -V | tail -1)
          BT=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d /tmp/snapshot/classes /tmp/snapshot/Snapshot.java
          "$BT/d8" --lib "$ANDROID_JAR" --output /tmp/snapshot/dex /tmp/snapshot/classes/org/dotwel/snapshot/Snapshot.class
          "$BT/aapt2" link -o /tmp/snapshot/helper.apk --manifest /tmp/snapshot/AndroidManifest.xml -I "$ANDROID_JAR"
          (cd /tmp/snapshot/dex && zip -q /tmp/snapshot/helper.apk classes.dex)
          keytool -genkeypair -keystore /tmp/snapshot/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname CN=Android -keyalg RSA -validity 1
          "$BT/apksigner" sign --ks /tmp/snapshot/debug.keystore --ks-pass pass:android /tmp/snapshot/helper.apk
      - name: Install and inspect widgets on Android 15
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 300
          disable-animations: true
          script: adb install -r /tmp/snapshot/helper.apk && timeout 1000s python3 -u /tmp/widget-runtime-smoke.py
      - name: Preserve actual runtime captures even after a failed check
        if: always()
        run: |
          set -eu
          test -d runtime-evidence || { echo 'Emulator never produced runtime evidence'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="checkpoint/runtime-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add -f runtime-evidence
          git commit -m 'test: preserve actual emulator screenshots and behavior evidence'
          git push origin "$branch"
          printf 'Evidence branch: %s\nScreenshots require human inspection before any pass claim.\n' "$branch" >> "$GITHUB_STEP_SUMMARY"
