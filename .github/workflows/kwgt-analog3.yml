name: Add source Nothing Analog3 native clock
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 247227700167af8f1147856b54c54b1cebb29296
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/kwgt-analog3-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          curl -fsSL https://raw.githubusercontent.com/AumGupta/KWGT-Widgets/96ca27be4cbff35efec5a86c64dd39fd065c958f/widgets/Nothing_Analog_3.kwgt -o /tmp/analog3.kwgt
          mkdir -p /tmp/analog3-preset && unzip -oq /tmp/analog3.kwgt -d /tmp/analog3-preset
          cat > /tmp/widget-task.txt <<'TASK'
          Implement ONE next compatible actualsource Nothing_Analog_3 from /tmp/analog3-preset/preset.json pinnedMIT96ca27be4cbff35efec5a86c64dd39fd065c958f. Base16verified2472277, preserveall16. New KwgtAnalog3WidgetProvider/catalog KWGT Analog3 Clockcategory notalias. Sourceonlycircleandtwohollowcapsulehands, NOsecondshand/font/art. Native RemoteViews AnalogClock widget is allowed platformclass and shouldprovide livehandswithoutapp/exactalarm. Use android.widget.AnalogClock with dial/hour/minute drawables derivedactualsourcegeometry, generated bitmapdrawables programmaticallyviaRemoteViews setters ifsupported? FirstinspectAndroidRemoteViewsAnalogClock API: setImageViewBitmap doesn'tapplyAnalogClock, standardsetInt onlyresource IDs fordial? Native XML android:dial/hourHand/minuteHand are drawableresources. Use scalable vector resources with viewport277square and transparentfullcanvas270-ish so pivotcenter. Sourceborderfilledcirclebgwhite/light or1B1B1Ddark; min hollowpillwidthside/13.85,height side/2.475,paddingbottomside/2.988; hourwidthside/13.85,height side/3.3765,paddingbottomside/4.4675; strokeside/138.5 foregroundoppositebg. AncestorrotationMinute andHourSmooth, nativeAnalogClock minutehand+hourhandautoupdate appropriate (hour includesminute). Keep bothdrawables centeredatclockpivotwithpill extendingup: childcenterY=-paddingbottom/2 (Kustompadding shiftscenterhalf), geometryvalidateactualarchivepreviewifavailable. Resourcevectorfull277canvas allowsnativeclocknativeviewmaintainaspectratio. SetshowSecondHandfalse ifAPIunsupported do notaddseconds. No fontpayload/bitmapclocktime/frozenfallback. Need separate light/darkvector/dial stylesandproviderlayoutmapping forblack/translucent/transparent ifpossible; transparentnativeclockdialnone buthandsreadable. NativeAnalogClock RemoteViews inflation provenonlyruntime, use supportedclassnotcustomView. No claimuntilhosttest. If nativeAnalogClock notallowed/drawableroutingfails stopwithcleartechnicalblocker notfakebitmap. Defaultcenter/fittedhostwithsourcecircle andactualpillproportions nootherdesign. ClocktapviaexistingintentACTION_SHOW_ALARMS. No newpermissions/services/deps/alarmpaths. SanitizedactualJSON stripemail/events nootherassets, MITattributionledger11of40implemented17providerspendingruntime. Previewuse samevectorsatcurrenttime, viaAnalogClockinsidegallery supportedor ownrenderer samegeometry date-now onlypreview andnativeclockactualhands. Add/pinproviderinfo/manifest/WidgetUpdater/PinResultProviderpaths. Unitgeometry/drawableRemoteViewssafetytests. Buildunitlintbyminute7end9. Source no seconds, noAlarmsneeded native live processkilltest minutechange andtap+pixelsnext. Do not silentlysubstitutetextclock as analogimport. PreserveexistingCleanInfo/Battery2 andbatteryrefreshfix. Free/private/nolauncherhistoryvisibilitychanges.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          rm -f checkpoints/dotwel-widgets-polish-debug.apk checkpoints/POLISH-SHA256SUMS
          bash ./gradlew assembleDebug testDebugUnitTest --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
