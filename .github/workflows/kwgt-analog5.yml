name: Add source Analog5 native tick clock
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 294b4326319b8a8a0de57ca28efb656321a6626f
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/kwgt-analog5-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          curl -fsSL https://raw.githubusercontent.com/AumGupta/KWGT-Widgets/96ca27be4cbff35efec5a86c64dd39fd065c958f/widgets/Nothing_Analog_5.kwgt -o /tmp/analog5.kwgt
          mkdir -p /tmp/analog5-preset && unzip -oq /tmp/analog5.kwgt -d /tmp/analog5-preset
          cat > /tmp/widget-task.txt <<'TASK'
          Implement ONE newactualsource Nothing_Analog_5 from /tmp/analog5-preset/preset.json. Preserve17providersincAnalog3/Battery2refresh. NativeAnalogClockpathproved actualHOME,killminuteadvance/tap inAndroid15. No tests-firstplanningloop; writeactualimplementation first. Create separateKwgtAnalog5WidgetProvider18th withsameNativeAnalogClock+stylelayout+vectorapproach asAnalog3, distinct source geometry/dial. NO rastertime/minutealarm/newdependency/permission/font/assets. Sourceglobals: side=min(width,height),bgdark1B1B1D/lightwhite,fgopposite,primaryD71921. Sourcehglobal missing. Explicitdocument adaptation squareheight=side, notinventnewmeaning. Staticdialvectorviewport277: outerroundrect277square corner55.4; cliproundrect width277/1.08,height277,corner277/6 centered; 60minuteRECTticks width4height277/5 circle size277 in sourceProgressModule positions, reproduceactualrotatedplacements and clip; overlayroundrectwidth277/1.15height277corner277/6.8 bg;12hourRECTtickswidth6height277/4circle size277; innermaskoverlaywidth277/1.3height277corner277/7 bg. NeedverifyKustomprogress placement semantics from existingpresets/renderers, noinventcirclewhereclippingroundedrectangle. Filledroundpillhour width277/13.19 height277/4.134 centerY138.5-(277/6.155)/2,redD71921. Filledroundpillminute width277/25.18 height277/2.77 centerY138.5-(277/3.112)/2,fg. Full277canvasvectorhands pivotcenter,NativeAnalogClockrotates hourlycontinuousminute-resolution/minutesteps,no seconds in source. Source rawshape_width10 overriddenformula uses277/25.18, useformula. Blacknative dial,translucentrespectstylewhitealpha/darkfg,transparent nofilledbg but retainedticks+hands. Three layouts sameAnalog3 approach, supportedRemoteViews controls ONLY. GallerysameinflateNativeAnalogClock style/sourcecurrenttime, Add/pin/catalogClock/manifest/updaterkind distinct kwgt_analog_5. SourceJSONsanitizedremoveauthoremail/tap/fontpaths, attributionledger12of40/18pendingruntime. MinuteTickScheduler untouched fornewnativeclock. Preserveexistingallrenderers EXACT. Add testsnewgeometry/dialtickcounts/clipstyles/tagallowlist. Build sequentialinprocess viaexistingworkflow. Trim newcatalogdescription friendly oneparagraph, formulasindocs notuserUI. Correct STATEfinalcandidate hashnotclaimuntilworkflowfinalbuild, saygeneratedPOLISH-SHA256SUMS authoritative. Reportmissingh/squareadaptation+native minutehour precision insteadclaimexactsource. No launcher/prod/visibility/historyedits.Freeonly. Endcodingwithin8minutes, no daemonparallelgradle. Runtime/physical/style/resizeunverified untilindependentgate.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          rm -f checkpoints/dotwel-widgets-polish-debug.apk checkpoints/POLISH-SHA256SUMS
          pkill -f '[K]otlinCompileDaemon' || true
          bash ./gradlew --stop || true
          rm -rf app/build/kotlin
          bash ./gradlew assembleDebug testDebugUnitTest -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false --no-daemon --max-workers=1
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
