name: Add source Nothing Battery2 widget
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-date-polish
  cancel-in-progress: false
env:
  OPENCODE_VERSION: '1.19.6'
  MODEL: opencode/deepseek-v4.1-flash-free
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 391f2b6db080cc57eb8b08b229e889f02108d538
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.config/opencode
            ~/.local/share/opencode
            ~/.npm
            ~/.npm-global
          key: opencode-1.19.6-superpowers-7.0.2-v2
          restore-keys: opencode-1.19.6-superpowers-
      - name: Prepare free coding tool and branch
        run: |
          set -eu
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/opencode" ]; then npm install -g opencode-ai@$OPENCODE_VERSION; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "agent/kwgt-battery2-${GITHUB_RUN_ID}"
      - name: Apply reference-led widget browser and renderer polish
        timeout-minutes: 11
        env:
          OPENCODE_CONFIG_CONTENT: '{"plugin":["superpowers@git+https://github.com/obra/superpowers.git#v7.0.2"],"permission":{"external_directory":"allow","bash":"allow","edit":"allow","webfetch":"deny"}}'
        run: |
          curl -fsSL https://raw.githubusercontent.com/AumGupta/KWGT-Widgets/96ca27be4cbff35efec5a86c64dd39fd065c958f/widgets/Nothing_Battery2.kwgt -o /tmp/battery2.kwgt
          mkdir -p /tmp/battery2-preset && unzip -oq /tmp/battery2.kwgt -d /tmp/battery2-preset
          cat > /tmp/widget-task.txt <<'TASK'
          Implement ONE next actual KWGT Nothing_Battery2 native widget from /tmp/battery2-preset/preset.json MIT pinned96ca27be4cbff35efec5a86c64dd39fd065c958f based on15tested391f2b6. Read actual JSON then write. New KwgtBattery2WidgetProvider distinct catalog KWGT Battery2 under existing battery category, no aliases. Keep15existing source/providers untouched. Native no newpermissions/network/services/dependencies/fonts/assets.
          Actual source415x542; side=min(width,height), source dark1B1B1D/lightwhite, opposite fg, accentfg50percentalpha, rounded bgcornersside/5; Info center xoffsetside/8.5. BATTERY labelside/18 bottompadding16; battery outlined body195x78 corners14 stroke3.5, clip179x64 corners7,16rectprogresssegments size184 levelbi(level) fg/accent with widthformulas present but toggles0 so preserve effective literals proportionalreference277side; nub5x28 margin5. Largeactuallevel side/4.5 with smallerpercent side/10. Bottomsourcefull/emptyestimate hours/minutes side/15 and red REMAINING. Android cannot reliably expose discharge time. NEVERfake estimate. Use BatteryManager.computeChargeTimeRemaining when realavailable while charging; label TO FULL then. If unknown use -- and estimate unavailable text ratherthan fabricatedH/M, document source adaptation clearly. At100 use FULL status only, no inventedtime. Primaryglobal lacksvalue, retain redD71921 fromsource REMAINING paint fallback. Sourceh globalmissing, fit square/portrait host preserving readable wholecomposition, document correction. Source ndotfont prohibited, use existing originalDotwelglyphs for bitmaplabel/numbers or platformsans substitute with note. RealBatteryManager/BATTERY_CHANGED charging/level and resize/bootupdate integration. NativeRemoteViewssupportedonly. BatteryIntent ACTION_POWER_USAGE_SUMMARY with ActivityNotFound fallback knownsettings. Preview shares renderer and Add/pin/providerinfo/manifest/catalog count16. No clock/alarm needed for battery.
          Preserve exact source proportionrelations and actual16segments/clipping. Add sanitizedJSON strippedemail/events/fontpaths and attribution/ledger10of40native16providers pendingruntime. Addunitgeometry/levelclamp/estimateunknown tests. Firstbuildminute7 endby9. Assemble/unit/lint. No fullcollectionclaim. Runtime independentgate will pin and inject emulator battery73discharging→42charging and confirm actualdisplay/segments/unknownestimate honest, plus batterytap destination and pixels. No changeslauncher/privatevisibility/history. Freeonly.
          TASK
          timeout --kill-after=15s 600s opencode run -m "$MODEL" "$(cat /tmp/widget-task.txt)"
      - uses: actions/setup-java@v6
        if: always()
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: always()
      - uses: android-actions/setup-android@v3
        if: always()
        with:
          packages: platform-tools
      - name: Build and preserve the candidate immediately
        if: always()
        run: |
          set -eu
          rm -f checkpoints/dotwel-widgets-polish-debug.apk checkpoints/POLISH-SHA256SUMS
          bash ./gradlew assembleDebug testDebugUnitTest --no-daemon
          mkdir -p checkpoints
          cp app/build/outputs/apk/debug/app-debug.apk checkpoints/dotwel-widgets-polish-debug.apk
          sha256sum checkpoints/dotwel-widgets-polish-debug.apk > checkpoints/POLISH-SHA256SUMS
          printf 'Debug candidate. Runtime appearance and home widget behavior require independent review.\n' > checkpoints/POLISH-NOTES.txt
      - name: Verify lint without suppressions
        if: always()
        run: bash ./gradlew lintDebug --no-daemon
      - name: Save source and candidate privately even on a coding timeout
        if: always()
        run: |
          set -eu
          git add app docs README.md
          if [ -d checkpoints ]; then git add -f checkpoints; fi
          if ! git diff --cached --quiet; then git commit -m 'fix: build actual source ports and extend native collection'; fi
          git push -u origin HEAD
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git branch --show-current >> "$GITHUB_STEP_SUMMARY"
