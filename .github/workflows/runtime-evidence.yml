name: Isolated ordinary-process-death minute check
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-runtime
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c29668f6e59e5b7d0659fe7ae14872d02b8f7b23
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Prepare bounded evidence script
        run: |
          cat > /tmp/widget-runtime-smoke.py <<'PYCODE'
          import subprocess as sp,pathlib,time,re,xml.etree.ElementTree as ET,json,hashlib
          OUT=pathlib.Path('runtime-evidence');OUT.mkdir(exist_ok=True);PKG='com.dotwelwidgets.dotwellabs';report={'version':'0.1.7','tests':{},'limits':['Pixel emulator only; pixels need review; not full collection complete.']}
          def adb(*a,check=True):
           r=sp.run(['adb',*a],capture_output=True,timeout=35)
           if check and r.returncode:raise RuntimeError(r.stderr.decode(errors='replace'))
           return r.stdout
          def tree():
           adb('shell','uiautomator','dump','/sdcard/window.xml',check=False)
           try:return ET.fromstring(adb('exec-out','cat','/sdcard/window.xml',check=False))
           except:return ET.Element('empty')
          def cap(name):
           (OUT/(name+'.png')).write_bytes(adb('exec-out','screencap','-p'));r=tree();(OUT/(name+'.xml')).write_bytes(ET.tostring(r));return r
          def find(r,s,exact=False):
           return next((n for n in r.iter('node') if any((s.lower()==n.get(k,'').lower() if exact else s.lower() in n.get(k,'').lower()) for k in ('text','content-desc','resource-id'))),None)
          def click(n):
           if n is None:raise RuntimeError('Missing UI target')
           b=list(map(int,re.findall(r'\d+',n.get('bounds',''))));adb('shell','input','tap',str((b[0]+b[2])//2),str((b[1]+b[3])//2));time.sleep(.7)
          def home():adb('shell','input','keyevent','3');time.sleep(1)
          def start():adb('shell','am','start','-W','-n',PKG+'/.MainActivity');time.sleep(1)
          def scroll():adb('shell','input','swipe',str(w//2),str(h*8//10),str(w//2),str(h*3//10),'350')
          def button(label):
           start()
           # Reset scroll through activity recreation, without force-stop or alarm cancellation.
           adb('shell','am','force-stop',PKG);start()
           for i in range(4):
            r=tree();n=find(r,label,True)
            if n is not None:return n
            scroll()
           raise RuntimeError('Gallery control missing '+label)
          def native(r):
           for label in ('Add to home screen','Add automatically','Add widget','Add'):
            n=find(r,label,True)
            if n is not None and n.get('clickable')=='true':return n
           return None
          def locate(needle,name):
           home()
           for i,d in enumerate((0,1,1,1,1,-1,-1,-1,-1)):
            if d:adb('shell','input','swipe',str(w*(8 if d==1 else 2)//10),str(h//2),str(w*(2 if d==1 else 8)//10),str(h//2),'350');time.sleep(.6)
            r=tree()
            if find(r,needle) is not None:return cap(name)
           raise RuntimeError('HOME view missing '+needle)
          def pin(label,name,plain=None):
           click(button(label));r=tree()
           if plain:click(find(r,plain,True));r=tree()
           if label=='Add World Clock':click(find(r,'Save and add',True));r=tree()
           cap('native-'+name);n=native(r)
           if n is None:raise RuntimeError('Native prompt missing '+label)
           click(n);time.sleep(1);report['tests']['pin_'+name]='Native confirmation accepted'
          def test(name,fn):
           try:
            print('START '+name,flush=True);fn();report['tests'].setdefault(name,'passed');(OUT/'RESULT.json').write_text(json.dumps(report,indent=2));print('DONE '+name,flush=True)
           except Exception as e:
            report['tests'][name]={'error':str(e)};cap('failure-'+name);raise
          try:
           w,h=list(map(int,re.findall(r'\d+',adb('shell','wm','size').decode())))[-2:];adb('shell','input','keyevent','82');home();cap('00-preinstall-host');(OUT/'preinstall-logcat.txt').write_bytes(adb('logcat','-d','-t','2000',check=False));(OUT/'preinstall-processes.txt').write_bytes(adb('shell','ps','-A',check=False))
           for i in range(4):
            r=tree();n=find(r,'android:id/aerr_close')
            if n is not None:click(n);home()
            elif any(n.get('package','')=='com.google.android.apps.nexuslauncher' for n in r.iter('node')):break
            time.sleep(3)
           else:raise RuntimeError('Launcher readiness failed before app install')
           (OUT/'am-help.txt').write_bytes(adb('shell','am','help'))
           apk=pathlib.Path('checkpoints/dotwel-widgets-polish-debug.apk');report['sha256']=hashlib.sha256(apk.read_bytes()).hexdigest()
           if report['sha256']!='6ff87b965ba7ece5eca5da792a61581f5db996e8f129178ca004296bb5c1d556':raise RuntimeError('Final APK hash mismatch')
           adb('install','-r',str(apk));w,h=list(map(int,re.findall(r'\d+',adb('shell','wm','size').decode())))[-2:];adb('shell','settings','put','system','time_12_24','24');start();cap('01-gallery-top')
           adb('shell','settings','put','system','font_scale','1.3');adb('shell','am','force-stop',PKG);start();cap('02-gallery-large-font');adb('shell','settings','put','system','font_scale','1.0')
           def cancel_clock():
            click(button('Add Digital Clock'));r=cap('03-denied-explanation')
            if find(r,'Add plain live clock',True) is None:raise RuntimeError('Missing explicit fallback choice')
            click(find(r,'Add plain live clock',True));r=cap('04-native-cancel');
            if native(r) is None:raise RuntimeError('No native prompt')
            adb('shell','input','keyevent','4');home();r=cap('05-home-cancel')
            if find(r,'clock_time') is not None:raise RuntimeError('Canceled clock placed')
           test('clock_plain',lambda:pin('Add Digital Clock','clock-plain','Add plain live clock'))
           test('home_plain',lambda:locate('clock_time','06-home-plain'))
           def enable():
            start();click(button('Enable'))
            for i in range(8):
             r=tree();n=next((n for n in r.iter('node') if n.get('checkable')=='true'),None)
             if n is not None:break
             time.sleep(1)
            cap('07-native-access')
            if n is None:raise RuntimeError('No Android toggle')
            if n.get('checked')!='true':click(n)
            adb('shell','input','keyevent','4');start();cap('08-access-return');locate('widget_clock_bitmap','09-home-dots')
           test('enable_setup',enable)
           def freshness():
            home();r=cap('20-before-ordinary-kill');before=find(r,'widget_clock_bitmap').get('content-desc','')
            (OUT/'alarms-before.txt').write_bytes(adb('shell','dumpsys','alarm'))
            (OUT/'access-before.txt').write_bytes(adb('shell','appops','get',PKG,'SCHEDULE_EXACT_ALARM',check=False))
            adb('shell','am','kill',PKG);report['ordinary_kill_pid']=adb('shell','pidof',PKG,check=False).decode().strip()
            if report['ordinary_kill_pid']:raise RuntimeError('am kill did not remove process')
            seconds=int(adb('shell','date','+%s').decode())%60;time.sleep(70-seconds)
            r=cap('21-after-minute');after=find(r,'widget_clock_bitmap').get('content-desc','');device=adb('shell','date','+%H:%M').decode().strip()
            report['freshness']={'before':before,'after':after,'device':device,'death':'am kill only, no force-stop after access setup'}
            (OUT/'alarms-after.txt').write_bytes(adb('shell','dumpsys','alarm'))
            if before==after or device not in after:raise RuntimeError('Isolated ordinary-kill minute freshness failed')
           test('freshness',freshness)
          except Exception as e:report['error']=str(e);cap('99-fatal')
          finally:
           (OUT/'RESULT.json').write_text(json.dumps(report,indent=2));(OUT/'logcat.txt').write_bytes(adb('logcat','-d','-t','3500',check=False));print(json.dumps(report,indent=2))
          if 'error' in report or any(isinstance(v,dict) and 'error' in v for v in report['tests'].values()):raise SystemExit(1)
          PYCODE
      - name: Install and inspect widgets on Android 15
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 300
          disable-animations: true
          script: timeout 480s python3 -u /tmp/widget-runtime-smoke.py
      - name: Preserve actual runtime captures even after a failed check
        if: always()
        run: |
          set -eu
          test -d runtime-evidence || { echo 'Emulator never produced runtime evidence'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="checkpoint/runtime-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add -f runtime-evidence
          git commit -m 'test: preserve actual emulator screenshots and behavior evidence'
          git push origin "$branch"
          printf 'Evidence branch: %s\nScreenshots require human inspection before any pass claim.\n' "$branch" >> "$GITHUB_STEP_SUMMARY"
