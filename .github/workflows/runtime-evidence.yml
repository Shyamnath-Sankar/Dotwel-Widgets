name: Read-only publication inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Inventory historical publication surface
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          python3 - <<'PY'
          import subprocess as sp,json,re
          def git(*a):return sp.check_output(['git',*a])
          objects=git('rev-list','--objects','--all').decode().splitlines()
          files=[];reviews=[];seen=set()
          for row in objects:
            p=row.split(' ',1)
            if len(p)!=2:continue
            oid,path=p
            if oid in seen or git('cat-file','-t',oid).strip()!=b'blob':continue
            seen.add(oid);size=int(git('cat-file','-s',oid));files.append({'oid':oid,'path':path,'size':size})
            if size>3000000:continue
            data=git('cat-file','blob',oid)
            if b'\0' in data[:4096]:continue
            for kind,pat in {'personal_contact':rb'(?:\+919361899061|9361899061|shyamnathsankar[^\s<>"\x27]*@)','build_internal':rb'(?i)(?:/memory/|agent-01[A-Z0-9]{20,}|chat-sessions/|system prompt|tools CLI|parent agent|task agent)','rights_license':rb'(?i)(?:SIL OPEN FONT|Copyright.*Font|DotGothic|NothingWidgetPort)','encoded_bitmap':rb'bitmap_url=data:image/'}.items():
              if re.search(pat,data):reviews.append({'kind':kind,'path':path,'oid':oid})
          print(json.dumps({'files':files,'reviews':reviews},indent=2))
          PY
