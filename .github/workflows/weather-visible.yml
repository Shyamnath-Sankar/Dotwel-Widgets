name: Weather visible dialog native host gate
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-runtime
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: aa6e9d61a90e264162410864dd9d1a6d85a75702
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Prepare bounded evidence script
        run: |
          python3 -m pip install --break-system-packages Pillow
          cat > /tmp/widget-runtime-smoke.py <<'PYCODE'
          import subprocess as sp,pathlib,time,re,xml.etree.ElementTree as ET,json,hashlib
          OUT=pathlib.Path('runtime-evidence');OUT.mkdir(exist_ok=True);PKG='com.dotwelwidgets.dotwellabs';report={'version':'0.1.8','tests':{},'limits':['Pixel emulator only; pixels need review; not full collection complete.']}
          def adb(*a,check=True):
           r=sp.run(['adb',*a],capture_output=True,timeout=35)
           if check and r.returncode:raise RuntimeError(r.stderr.decode(errors='replace'))
           return r.stdout
          def tree():
           raw=adb('shell','am','instrument','-w','org.dotwel.snapshot/.Snapshot',check=False).decode(errors='replace')
           i=raw.find('<hierarchy');j=raw.find('</hierarchy>')
           if i<0 or j<0:raise RuntimeError('No fresh no-idle hierarchy: '+raw[:250])
           return ET.fromstring(raw[i:j+12])
          def cap(name):
           r=tree();time.sleep(.5);(OUT/(name+'.png')).write_bytes(adb('exec-out','screencap','-p'));(OUT/(name+'.xml')).write_bytes(ET.tostring(r));return r
          def find(r,s,exact=False):
           return next((n for n in r.iter('node') if any((s.lower()==n.get(k,'').lower() if exact else s.lower() in n.get(k,'').lower()) for k in ('text','content-desc','resource-id'))),None)
          def wait_target(s,exact=True):
           for attempt in range(6):
            n=find(tree(),s,exact)
            if n is not None:return n
            time.sleep(.6)
           raise RuntimeError('UI target not ready: '+s)
          def click(n):
           if n is None:raise RuntimeError('Missing UI target')
           b=list(map(int,re.findall(r'\d+',n.get('bounds',''))));adb('shell','input','tap',str((b[0]+b[2])//2),str((b[1]+b[3])//2));time.sleep(.7)
          def home():adb('shell','input','keyevent','3');time.sleep(1)
          def start():adb('shell','am','start','-W','-n',PKG+'/.MainActivity');time.sleep(1)
          def scroll():adb('shell','input','swipe',str(w//2),str(h*8//10),str(w//2),str(h*3//10),'350')
          def button(label):
           start()
           # Reset scroll through activity recreation, without force-stop or alarm cancellation.
           adb('shell','am','force-stop',PKG);start()
           for i in range(12):
            r=tree();n=find(r,label,True)
            if n is not None:return n
            if not any(n.get('package','')==PKG for n in r.iter('node')):raise RuntimeError('App left foreground while locating '+label)
            scroll()
           raise RuntimeError('Gallery control missing '+label)
          def native(r):
           for label in ('Add to home screen','Add automatically','Add widget','Add'):
            n=find(r,label,True)
            if n is not None and n.get('clickable')=='true':return n
           return None
          def locate(needle,name):
           home()
           for i,d in enumerate((0,1,1,1,1,-1,-1,-1,-1)):
            if d:adb('shell','input','swipe',str(w*(8 if d==1 else 2)//10),str(h//2),str(w*(2 if d==1 else 8)//10),str(h//2),'350');time.sleep(.6)
            r=tree()
            if find(r,needle) is not None:return cap(name)
           raise RuntimeError('HOME view missing '+needle)
          def pin(label,name,plain=None):
           click(button(label));r=tree()
           if plain:click(wait_target(plain));r=tree()
           if label=='Add World Clock':click(find(r,'Save and add',True));r=tree()
           cap('native-'+name);n=native(r)
           if n is None:raise RuntimeError('Native prompt missing '+label)
           click(n);time.sleep(1);report['tests']['pin_'+name]='Native confirmation accepted'
          def test(name,fn):
           try:
            print('START '+name,flush=True);fn();report['tests'].setdefault(name,'passed');(OUT/'RESULT.json').write_text(json.dumps(report,indent=2));print('DONE '+name,flush=True)
           except Exception as e:
            report['tests'][name]={'error':str(e)};cap('failure-'+name);raise
          try:
           w,h=list(map(int,re.findall(r'\d+',adb('shell','wm','size').decode())))[-2:]
           adb('shell','input','keyevent','82');home()
           apk=pathlib.Path('checkpoints/dotwel-widgets-polish-debug.apk');report['sha256']=hashlib.sha256(apk.read_bytes()).hexdigest()
           assert report['sha256']=='744113378d5bf9bd4b4ff2f58bbe957d1269a9591ecf02665d2cebf41c9f92fa'
           adb('install','-r',str(apk));start();cap('01-default-off')
           def seek(s,exact=True):
            for i in range(16):
             n=find(tree(),s,exact)
             if n is not None:return n
             scroll();time.sleep(.35)
            raise RuntimeError('Missing '+s)
           def dialog(s):
            start();click(seek('weather_button',False));cap(s)
           def prefs(name):
            raw=adb('shell','run-as',PKG,'cat','shared_prefs/dotwel_weather.xml',check=False).decode();(OUT/(name+'.txt')).write_text(raw);return raw
           dialog('01-weather-disclosure');p=prefs('off-prefs');assert 'weather_enabled' not in p or 'value="false"' in p
           report['tests']['default_off']='No weather preference/location/cache before enable'
           click(seek('Enable weather',False));click(seek('Type a city, then Search'));adb('shell','input','text','Oslo');cap('01-entered-city');click(seek('Search city'));time.sleep(4);cap('02-search-results')
           for i in range(12):
            if find(tree(),'Oslo',False) is not None and 'weather_location' not in prefs('search-prefs'):break
            time.sleep(1)
           # Explicit nonpersonal test location, not owner location.
           click(seek('Oslo, Oslo, Norway',False));click(seek('Use selected city'));time.sleep(5);cap('03-selected-city')
           for i in range(18):
            p=prefs('fetch-prefs')
            if 'forecast_json' in p:break
            time.sleep(1)
           else:raise RuntimeError('Real weather fetch did not cache within timeout')
           report['tests']['actual_network_fetch']='Manual consent and Oslo Norway selection; real forecast cached'
           click(find(tree(),'Close',True));time.sleep(.5)
           def category(name):
            adb('shell','am','force-stop',PKG);start();click(seek('Open '+name+',',False));wait_target('Close category')
           def pin_weather(name,key):
            category('Weather')
            for i in range(14):
             r=tree()
             if find(r,'Add '+name,True) is not None:break
             click(wait_target('Next'))
            cap('gallery-'+key);click(wait_target('Add '+name));cap('native-'+key);n=native(tree())
            if n is None:raise RuntimeError('No nativepin '+name)
            click(n);time.sleep(1);report['tests']['pin_'+key]='Native confirmation accepted'
           pin_weather('Nothing Temp','temp')
           pin_weather('Nothing Sun Info','sun')
           def hostnode(r,key):
            parents={c:p for p in r.iter() for c in p};n=find(r,key)
            if n is None:raise RuntimeError('No host '+key)
            return n
           for key in ['weather_temp','weather_sun']:
            r=locate(key,'home-'+key);report[key+'_nodes']=[n.attrib for n in r.iter('node') if key in str(n.attrib)]
           adb('shell','am','kill',PKG);assert PKG not in adb('shell','ps','-A').decode();report['tests']['killed']='process absent';time.sleep(3)
           r=locate('weather_temp','home-temp-afterkill');n=find(r,'weather_temp');b=list(map(int,re.findall(r'\d+',n.get('bounds',''))));report['temp_bounds']=b
           x,y=(b[0]+b[2])//2,(b[1]+b[3])//2
           adb('shell','input','swipe',str(x),str(y),str(x),str(y),'1500');cap('resize-handles');adb('shell','input','swipe',str(b[2]+22),str(y),str(b[2]+275),str(y),'900');adb('shell','input','tap',str(w-30),str(h-250));time.sleep(1);cap('resize-temp-wide')
           r=locate('weather_sun','home-sun-afterkill');click(find(r,'weather_sun'));time.sleep(1);cap('tap-opens-weather')
           click(seek('Delete location and cached data'));cap('delete-confirm');click(wait_target('Delete and turn off'));time.sleep(1);cap('disabled-settings');p=prefs('revoked-prefs');assert 'weather_location' not in p and 'forecast_json' not in p and 'value="true"' not in p
           click(find(tree(),'Close',True));locate('weather_temp','home-temp-disabled');locate('weather_sun','home-sun-disabled');report['tests']['disable_delete']='No city or forecast cache remains; actual native disabled captures saved'
           (OUT/'appwidget-dump.txt').write_bytes(adb('shell','dumpsys','appwidget'))
          except Exception as e:report['error']=str(e);cap('99-fatal')
          finally:
           (OUT/'RESULT.json').write_text(json.dumps(report,indent=2));(OUT/'logcat.txt').write_bytes(adb('logcat','-d','-t','3500',check=False));print(json.dumps(report,indent=2))
          if 'error' in report or any(isinstance(v,dict) and 'error' in v for v in report['tests'].values()):raise SystemExit(1)
          PYCODE
      - name: Build isolated no-idle snapshot test helper
        run: |
          set -eu
          mkdir -p /tmp/snapshot/classes /tmp/snapshot/dex
          cat > /tmp/snapshot/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="org.dotwel.snapshot"><uses-sdk android:minSdkVersion="26" android:targetSdkVersion="28"/><application android:label="Snapshot test helper" android:debuggable="true"/><instrumentation android:name=".Snapshot" android:targetPackage="org.dotwel.snapshot"/></manifest>
          MANIFEST
          cat > /tmp/snapshot/Snapshot.java <<'JAVA'
          package org.dotwel.snapshot;
          import android.app.Instrumentation;
          import android.os.Bundle;
          import android.graphics.Rect;
          import android.view.accessibility.AccessibilityNodeInfo;
          public class Snapshot extends Instrumentation {
           public void onCreate(Bundle b){super.onCreate(b);start();}
           static String esc(CharSequence s){return s==null?"":s.toString().replace("&","&amp;").replace("<","&lt;").replace("\"","&quot;").replace("\n","&#10;");}
           void node(AccessibilityNodeInfo n,StringBuilder s){if(n==null || !n.isVisibleToUser())return;Rect r=new Rect();n.getBoundsInScreen(r);if(r.width()<=0 || r.height()<=0)return;s.append("<node text=\"").append(esc(n.getText())).append("\" content-desc=\"").append(esc(n.getContentDescription())).append("\" resource-id=\"").append(esc(n.getViewIdResourceName())).append("\" package=\"").append(esc(n.getPackageName())).append("\" clickable=\"").append(n.isClickable()).append("\" bounds=\"[").append(r.left).append(',').append(r.top).append("][").append(r.right).append(',').append(r.bottom).append("]\">");for(int i=0;i<n.getChildCount();i++)node(n.getChild(i),s);s.append("</node>");}
           public void onStart(){Bundle out=new Bundle();try{android.app.UiAutomation u=getUiAutomation();android.accessibilityservice.AccessibilityServiceInfo info=u.getServiceInfo();info.flags|=android.accessibilityservice.AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS;u.setServiceInfo(info);AccessibilityNodeInfo root=null;for(int i=0;i<20 && root==null;i++){root=u.getRootInActiveWindow();if(root==null)Thread.sleep(100);}StringBuilder s=new StringBuilder("<hierarchy>");node(root,s);s.append("</hierarchy>");out.putString("xml",s.toString());finish(-1,out);}catch(Exception e){out.putString("error",e.toString());finish(1,out);}}
          }
          JAVA
          SDK="$ANDROID_HOME"
          ANDROID_JAR=$(find "$SDK/platforms" -name android.jar | sort -V | tail -1)
          BT=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d /tmp/snapshot/classes /tmp/snapshot/Snapshot.java
          "$BT/d8" --lib "$ANDROID_JAR" --output /tmp/snapshot/dex /tmp/snapshot/classes/org/dotwel/snapshot/Snapshot.class
          "$BT/aapt2" link -o /tmp/snapshot/helper.apk --manifest /tmp/snapshot/AndroidManifest.xml -I "$ANDROID_JAR"
          (cd /tmp/snapshot/dex && zip -q /tmp/snapshot/helper.apk classes.dex)
          keytool -genkeypair -keystore /tmp/snapshot/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname CN=Android -keyalg RSA -validity 1
          "$BT/apksigner" sign --ks /tmp/snapshot/debug.keystore --ks-pass pass:android /tmp/snapshot/helper.apk
      - name: Install and inspect widgets on Android 15
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 300
          disable-animations: true
          script: adb install -r /tmp/snapshot/helper.apk && timeout 1000s python3 -u /tmp/widget-runtime-smoke.py
      - name: Preserve actual runtime captures even after a failed check
        if: always()
        run: |
          set -eu
          test -d runtime-evidence || { echo 'Emulator never produced runtime evidence'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="checkpoint/runtime-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add -f runtime-evidence
          git commit -m 'test: preserve actual emulator screenshots and behavior evidence'
          git push origin "$branch"
          printf 'Evidence branch: %s\nScreenshots require human inspection before any pass claim.\n' "$branch" >> "$GITHUB_STEP_SUMMARY"
