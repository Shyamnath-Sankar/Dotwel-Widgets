name: Widget resource profile
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: widget-profile
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/consolidated-repair-45440491695
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms"
          "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build opt-in isolated fixtures
        run: |
          set -eu
          gradle --no-daemon --max-workers=2 -PrepairFixtures assembleDebug assembleDebugAndroidTest
          sudo chmod 666 /dev/kvm
      - name: Bounded Android resource profile sweep
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 300
          disable-animations: true
          script: timeout 1250s bash tools/repair/run_profile.sh
      - name: Preserve profile evidence
        if: always()
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "checkpoint/profile-${GITHUB_RUN_ID}"
          git add runtime-evidence
          git commit -m 'test: preserve widget resource profile evidence' || true
          git push origin HEAD
